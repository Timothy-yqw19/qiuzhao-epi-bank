<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="description" content="秋招行测在线题库：134 道银行 EPI 真题/仿真题，每题带破题技巧与逐步解析，支持随时记录自己的解题思路、错题本与 21 天刷题计划。">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --ink:#1f2328; --ink2:#5b6472; --ink3:#8b94a3;
  --acc:#2f6df6; --acc-soft:#eaf0ff; --ok:#15a34a; --ok-soft:#e8f7ee; --bad:#dc2626; --bad-soft:#fdecec;
  --warn:#c2740a; --warn-soft:#fdf3e3; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc)}
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px}
.brand .sub{font-weight:400;font-size:12px;color:var(--ink3);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{
  border:0;background:transparent;color:var(--ink2);padding:6px 11px;border-radius:9px;
  font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
nav button:hover{background:#eef0f3;color:var(--ink)}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1120px;margin:0 auto;padding:18px 16px 80px}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--ink)}
.muted{color:var(--ink3);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
select,input[type=text],input[type=search],textarea{
  font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{width:100%;resize:vertical;line-height:1.7}
button.btn{
  font:inherit;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:7px 13px;border-radius:9px;
}
button.btn:hover{background:#f7f8fa}
button.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.btn.primary:hover{filter:brightness(1.06)}
button.btn.ghost{border-color:transparent;background:#eef0f3}
button.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0f3;color:var(--ink2);
  white-space:nowrap;
}
.chip.acc{background:var(--acc-soft);color:var(--acc)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;line-height:1.3}
.stat span{font-size:12px;color:var(--ink3)}
/* 题库列表 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.qcard{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;min-height:104px;
}
.qcard:hover{border-color:var(--acc);box-shadow:0 3px 14px rgba(47,109,246,.10)}
.qcard .top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3)}
.qcard .no{font-weight:700;color:var(--ink);font-size:13px}
.qcard .stem{font-size:13.5px;color:var(--ink2);flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qcard .bot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d5d9e0;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.half{background:var(--warn)}
/* 练习 */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qbody{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.material{background:#fbfbfd;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.material .mtitle{font-size:12px;color:var(--ink3);margin-bottom:6px}
.material p{margin:.35em 0}
.md-table{border-collapse:collapse;margin:8px 0;font-size:13.5px}
.md-table th,.md-table td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.md-table th{background:#f2f4f7;font-weight:600}
.fig{margin:6px 0 14px;text-align:center}
.fig svg{max-width:100%;height:auto}
.fig img{max-width:100%;height:auto;border-radius:8px;background:#fff;cursor:zoom-in}
.fig svg{cursor:zoom-in}
.figcap{text-align:center;font-size:12.5px;color:var(--ink3);margin:-4px 0 10px}
#lightbox{position:fixed;inset:0;background:rgba(15,18,22,.93);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#lightbox.on{display:flex}
#lightbox .lb-inner{background:#fff;border-radius:10px;padding:12px;overflow:auto;max-width:100%;max-height:100%}
#lightbox img{max-width:none;display:block;background:#fff}
#lightbox svg{max-width:none;display:block}
#lightbox .lb-tip{position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#cbd3de;font-size:12.5px;pointer-events:none}
#lightbox .lb-close{position:fixed;right:14px;top:12px;background:#2b3240;color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
#rushTimer{font-weight:700}
#rushTimer.hot{color:var(--bad)}
.stem{font-size:16px;line-height:1.85;white-space:pre-wrap;margin-bottom:14px}
.stem strong{color:var(--ink);background:linear-gradient(transparent 62%,#ffe9a8 62%)}
.opts{display:flex;flex-direction:column;gap:8px}
.optsvg{display:inline-block;width:84px;height:84px;vertical-align:middle}
.optsvg svg{width:100%;height:100%;display:block}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;width:100%;line-height:1.6;
}
.opt:hover{border-color:var(--acc);background:#fafbff}
.opt .k{
  flex:0 0 22px;height:22px;border-radius:50%;background:#eef0f3;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;margin-top:1px;
}
.opt.picked{border-color:var(--acc);background:var(--acc-soft)}
.opt.picked .k{background:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.verdict{margin:14px 0 0;font-size:14.5px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.reveal{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.box{border-radius:12px;padding:11px 14px;margin-top:10px;font-size:14.2px;line-height:1.8}
.box .lab{font-size:12px;display:block;margin-bottom:3px;letter-spacing:.5px}
.box.tip{background:var(--acc-soft)}
.box.tip .lab{color:var(--acc)}
.box.ana{background:#f7f8fa}
.box.ana .lab{color:var(--ink3)}
.note-wrap{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.note-wrap .lab{font-size:12.5px;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pager{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.hot{color:var(--bad)}
/* 表格 */
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
table.list th{font-weight:600;color:var(--ink2);background:#fafbfc;position:sticky;top:56px}
table.list tr:hover td{background:#fafbff}
.nbox{background:#f7f8fa;border-left:3px solid var(--acc);padding:10px 13px;border-radius:0 10px 10px 0;margin:8px 0;font-size:14px}
ul.tight{margin:.3em 0;padding-left:1.25em}
ul.tight li{margin:.22em 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:#fff}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.banner{background:var(--warn-soft);border:1px solid #f2ddb4;color:#7a4c07;border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:12px}
.kbd{font:12px/1.6 ui-monospace,Menlo,monospace;background:#eef0f3;border-radius:5px;padding:1px 5px;color:var(--ink2)}
.bigtimer{font:700 64px/1.15 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:2px;text-align:center;margin:6px 0 2px}
.bigtimer.break{color:var(--ok)}
.bigtimer.paused{color:var(--ink3)}
.phase{text-align:center;font-size:13.5px;color:var(--ink2);margin-bottom:12px}
.timerbar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.timerbar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.timerbar.brk>i{background:var(--ok)}
#timerChip{display:inline-flex;align-items:center;gap:5px;background:#eef0f3;border-radius:99px;padding:4px 10px;font-size:13px;
  font-variant-numeric:tabular-nums;cursor:pointer;border:0;font-family:inherit;color:var(--ink)}
#timerChip:hover{background:#e4e7ec}
#timerChip.run{background:var(--acc-soft);color:var(--acc)}
@media (max-width:640px){
  .hd{gap:8px} nav{width:100%;margin-left:0;overflow-x:auto}
  .qbody{padding:14px}
  table.list th{position:static}
}
@media print{ header,nav,.pager,.reveal,.note-wrap{display:none} .view{display:block!important} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand">秋招行测题库<span class="sub" id="hdsub">银行 EPI</span></div>
    <nav id="tabs"></nav>
  </div>
</header>
<main>
  <section class="view" id="v-list"></section>
  <section class="view" id="v-practice"></section>
  <section class="view" id="v-wrong"></section>
  <section class="view" id="v-notes"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-timer"></section>
  <section class="view" id="v-quick"></section>
  <section class="view" id="v-data"></section>
</main>

<script>
/*__GEN__*/
"use strict";
const BANK = /*__BANK__*/;
const APPENDIX = /*__APPENDIX__*/;
const BASE_QS = BANK.questions;
const KEY = "epi_bank_v1";
const FRESH_KEY = "epi_fresh_v1";
const MAX_FRESH = 300;                 // 本机新生成题的保留上限（超出丢最早的，连带删其记录）

/* 题目分三类：原题(orig) / 构建期生成(gen) / 本机一键刷新的新题(fresh) */
const isOrig  = q => !q.src || q.src==="orig";
const isBuilt = q => q.src==="gen";
const isFresh = q => q.src==="fresh";
const isZhenti = q => q.src==="zhenti";
const isGen   = q => isBuilt(q) || isFresh(q);   // 「程序生成」的统称
const diffName = d => d===3?"难":d===2?"中":d===1?"易":"";
function diffChip(q){ const d=q.diff; if(!d) return ''; return '<span class="chip '+(d===3?"bad":d===2?"acc":"")+'">'+diffName(d)+'</span>'; }
function rushCfg(){ S.ui=S.ui||{}; S.ui.rush=S.ui.rush||{secs:0}; return S.ui.rush; }
const rushOn = () => rushCfg().secs>0;
const rushSecs = () => rushCfg().secs||0;

let freshQs = [], freshSeq = 900000;
let zhentiQs = [];                                // 本机导入的真题（公网站点载入不到，会自动跳过）
let QS = [], BY_ID = {}, MODULES = [], TOPICS = [];
let N_ORIG = 0, N_GEN = 0, N_FRESH = 0, N_ZHENTI = 0;

function loadFresh(){
  try{
    const o = JSON.parse(localStorage.getItem(FRESH_KEY));
    if(o && Array.isArray(o.list)){ freshQs = o.list; freshSeq = o.seq || 900000 + o.list.length; }
  }catch(e){}
}
function saveFresh(){
  try{ localStorage.setItem(FRESH_KEY, JSON.stringify({seq:freshSeq, list:freshQs})); }catch(e){ console.warn("新题保存失败", e); }
}
function pruneFresh(){
  const gone = {};
  while(freshQs.length > MAX_FRESH){
    const old = freshQs.shift();
    gone[old.id] = 1;
    if(S && S.rec && S.rec[old.id]) delete S.rec[old.id];   // 连带清掉记录，避免错题本指向已删除的题
  }
  if(Object.keys(gone).length){
    queue = queue.filter(id=>!gone[id]);                    // 同步收缩当前练习队列
    if(idx >= queue.length) idx = Math.max(0, queue.length-1);
  }
}
function reindex(){
  QS = BASE_QS.concat(freshQs, zhentiQs);
  BY_ID = {}; QS.forEach(q=>{ BY_ID[q.id]=q; });
  MODULES = []; TOPICS = [];
  QS.forEach(q=>{ if(!MODULES.includes(q.module)) MODULES.push(q.module);
                  if(!TOPICS.includes(q.topic)) TOPICS.push(q.topic); });
  N_ORIG = QS.filter(isOrig).length;
  N_GEN  = QS.filter(isBuilt).length;
  N_FRESH= QS.filter(isFresh).length;
  N_ZHENTI=QS.filter(isZhenti).length;
}
/* 真题库：只在本地载入（data/zhenti.json 已被 .gitignore 排除，不会上传到公网）
   状态分别对应不同提示：内嵌 / 已载入 / 公网无此文件（设计如此）/ 本机 404 / file:// / 网络错误 */
let zhentiState = (BANK.meta && BANK.meta.zhentiInlined) ? "inlined" : "unknown";
function isLocalHost(){
  const h=location.hostname||"";
  return h==="localhost" || h==="127.0.0.1" || h==="::1" || h==="[::1]"
      || /^192\.168\./.test(h) || /^10\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h);
}
function zhentiHint(){
  if(N_ZHENTI) return "";
  if(zhentiState==="public")
    return '<span class="muted">· 公网版按版权要求不含真题库（1500 题）；想在本机刷真题，见 README「本机真题库」</span>';
  if(zhentiState==="proto")
    return '<div class="banner">你是用 <code>file://</code> 直接打开的，浏览器不允许这种页面读取 <code>data/zhenti.json</code>。两个办法：<b>①</b> 双击同目录下的 <code>zhenti.local.html</code>（真题已内嵌，无需起服务）；<b>②</b> 在项目目录跑 <code>bash serve.sh</code>，再用 <code>http://127.0.0.1:8788/</code> 打开。</div>';
  if(zhentiState==="notfound")
    return '<div class="banner">本机服务里没找到 <code>data/zhenti.json</code>（404）。检查两点：<b>①</b> 服务目录是项目根目录——用 <code>bash serve.sh</code>；<b>②</b> 文件确实存在，没有就跑 <code>python3 import_zhenti.py</code>。也可以直接双击 <code>zhenti.local.html</code>。</div>';
  if(zhentiState==="error")
    return '<div class="banner">读取 <code>data/zhenti.json</code> 失败（网络错误）。可直接双击 <code>zhenti.local.html</code>（真题已内嵌）。</div>';
  return "";
}
function loadZhenti(list){
  zhentiQs = Array.isArray(list) ? list : [];
  reindex(); renderTabs(); refreshSubtitle();
  if(view==="list") renderList();
  if(view==="practice") renderPractice();
  if(view==="data") renderData();
  if(N_ZHENTI) toast("已载入本机真题库 "+N_ZHENTI+" 题");
}
function tryLoadZhenti(){
  if(zhentiState==="inlined") return;                    // 真题已内嵌进本文件，不用再拉
  if(typeof fetch !== "function"){ zhentiState="error"; return; }
  if(!/^https?:$/.test(location.protocol)){              // file:// 下取不到
    zhentiState="proto";
    if(view==="list") renderList();
    return;
  }
  fetch("data/zhenti.json").then(function(r){
      if(!r.ok){ zhentiState = isLocalHost() ? "notfound" : "public"; return null; }
      return r.json();
    })
    .then(function(d){
      if(d && Array.isArray(d.questions) && d.questions.length){ loadZhenti(d.questions); zhentiState="loaded"; }
      else if(zhentiState!=="public" && zhentiState!=="notfound"){ zhentiState = isLocalHost() ? "notfound" : "public"; }
      if(view==="list") renderList();
    })
    .catch(function(){ zhentiState="error"; if(view==="list") renderList(); });
}
function refreshSubtitle(){
  const sub=document.getElementById("hdsub");
  if(sub) sub.textContent="银行 EPI · 原题 "+N_ORIG+" + 生成 "+N_GEN
    +(N_ZHENTI?" + 真题 "+N_ZHENTI:"")+(N_FRESH?" + 新题 "+N_FRESH:"")+" · 离线可用";
}
function clearFresh(){
  const gone = {};
  freshQs.forEach(q=>{ gone[q.id]=1; if(S.rec[q.id]) delete S.rec[q.id]; });
  freshQs = []; saveFresh(); reindex(); save();
  queue = queue.filter(id=>!gone[id]); if(idx >= queue.length) idx = Math.max(0, queue.length-1);
}

/* ---------------- 存储 ---------------- */
let S = load();
function blank(){ return {v:1, rec:{}, plan:{}, ui:{mode:"practice"}}; }
function load(){
  try{ const o=JSON.parse(localStorage.getItem(KEY)); if(o&&o.rec) return Object.assign(blank(),o); }catch(e){}
  return blank();
}
let saveTimer=null;
function save(now){
  const doIt=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.warn("保存失败",e); } };
  if(now) return doIt();
  clearTimeout(saveTimer); saveTimer=setTimeout(doIt,300);
}
function R(id){
  if(!S.rec[id]) S.rec[id]={picked:null,correct:null,tries:0,wrong:0,timeMs:0,fav:false,doubt:false,note:"",ts:0};
  return S.rec[id];
}
const answered = id => S.rec[id] && S.rec[id].picked;
const isWrong  = id => S.rec[id] && S.rec[id].wrong>0;
const stateOf  = id => { const r=S.rec[id]; if(!r||!r.picked) return "none"; return r.correct?"ok":"bad"; };

/* ---------------- 通用 ---------------- */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 渲染用：先转义再转 markdown 加粗，防止题干/解析里的 < > 被当成标签 */
const mdEsc = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
const stemText = q => q.stem.replace(/\*\*/g,"").replace(/`/g,"").replace(/\s+/g," ").trim();
function fmtClock(ms){
  ms=Math.max(0,ms|0);
  const t=Math.round(ms/1000), m=Math.floor(t/60), s=t%60;
  if(m>=60) return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}
function download(name, text, mime){
  const blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function toast(msg){
  const d=document.createElement("div");
  d.textContent=msg;

/* ---------------- 学习计时器（番茄钟 + 今日时长） ---------------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtMS(ms){
  const s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}
function fmtDur(ms){
  const m=Math.round(ms/60000);
  if(m<60) return m+" 分钟";
  return Math.floor(m/60)+" 小时 "+String(m%60).padStart(2,"0")+" 分";
}
function timerInit(){
  const T=S.timer||(S.timer={});
  if(typeof T.focusMin!=="number") T.focusMin=25;
  if(typeof T.breakMin!=="number") T.breakMin=5;
  if(typeof T.rounds!=="number") T.rounds=0;
  if(typeof T.totalMs!=="number") T.totalMs=0;
  if(typeof T.todayMs!=="number") T.todayMs=0;
  if(typeof T.running!=="boolean") T.running=false;
  if(typeof T.mode!=="string") T.mode="focus";
  if(typeof T.remainingMs!=="number") T.remainingMs=T.focusMin*60000;
  if(T.day!==todayStr()){ T.day=todayStr(); T.todayMs=0; }   // 跨天归零
  if(T.running && T.lastAt){
    // 页面被关掉/休眠期间也在走：按墙钟补算（单次最多补 8 小时，防呆）
    const gap=Math.min(Math.max(0,Date.now()-T.lastAt), 8*3600000);
    if(gap>0) timerAdvance(gap, true);
  }
  T.lastAt=Date.now();
}
function timerAdvance(ms, silent){
  const T=S.timer; if(!T) return;
  if(T.mode==="focus"){ T.todayMs=(T.todayMs||0)+ms; T.totalMs=(T.totalMs||0)+ms; }
  T.remainingMs-=ms;
  let guard=0;
  while(T.remainingMs<=0 && guard++<200){
    if(T.mode==="focus"){ T.rounds=(T.rounds||0)+1; T.mode="break"; T.remainingMs+=T.breakMin*60000; }
    else { T.mode="focus"; T.remainingMs+=T.focusMin*60000; }
    if(!silent) timerNotify();
  }
  T.lastAt=Date.now();
  save();
}
function timerChipText(){
  const T=S.timer; if(!T) return "⏱ --:--";   // 页面刚加载时的兜底
  return (T.mode==="focus"?"🍅 ":"☕ ")+fmtMS(T.remainingMs);
}
function timerNotify(){
  const T=S.timer;
  toast(T.mode==="break" ? "专注结束 🍅 去休息 "+T.breakMin+" 分钟" : "休息结束 ☕ 回来继续刷题");
  try{                                   // 提示音：Web Audio 现场合成，不依赖音频文件
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){ const ctx=new AC(), o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=(T.mode==="break"?880:660);
      o.connect(g); g.connect(ctx.destination); g.gain.value=0.12;
      o.start(); setTimeout(()=>{ try{o.stop(); ctx.close();}catch(e){} }, 700); }
  }catch(e){}
  const base=document.title.replace(/^⏰ /,"");
  let n=0; const iv=setInterval(()=>{ document.title=(n%2?"⏰ 时间到 · ":"")+base; if(++n>6){ clearInterval(iv); document.title=base; } }, 700);
}
function timerToggle(){
  const T=S.timer; T.running=!T.running; T.lastAt=Date.now(); save(true); renderTimer(); renderTabs();
  if(T.running) toast((T.mode==="focus"?"专注开始 🍅 ":"休息开始 ☕ ")+fmtMS(T.remainingMs));
}
function timerReset(){
  const T=S.timer; T.running=false; T.mode="focus"; T.remainingMs=T.focusMin*60000; T.lastAt=Date.now();
  save(true); renderTimer(); renderTabs(); toast("已重置到 "+T.focusMin+" 分钟专注");
}
function timerSkip(){
  const T=S.timer;
  if(T.mode==="focus"){ T.rounds=(T.rounds||0)+1; T.mode="break"; T.remainingMs=T.breakMin*60000; }
  else { T.mode="focus"; T.remainingMs=T.focusMin*60000; }
  T.lastAt=Date.now(); save(true); renderTimer(); renderTabs();
}
function timerPreset(min, brk){
  const T=S.timer; T.focusMin=min; T.breakMin=brk; T.mode="focus"; T.running=false;
  T.remainingMs=min*60000; T.lastAt=Date.now(); save(true); renderTimer(); renderTabs();
  toast("已设为专注 "+min+" 分钟 / 休息 "+brk+" 分钟");
}
function renderTimer(){
  if(!S.timer) timerInit();
  const T=S.timer, total=(T.mode==="focus"?T.focusMin:T.breakMin)*60000;
  const pct=Math.max(0,Math.min(100,100*(1-T.remainingMs/total)));
  const presets=[[15,3],[25,5],[45,10],[60,10]];
  $("#v-timer").innerHTML='<div class="card">'
   +'<div class="row"><h2 style="margin:0">学习计时器</h2><span class="chip '+(T.running?"ok":"")+'">'+(T.running?"计时中":"已暂停")+'</span>'
   +'<span class="spacer"></span><span class="muted">今日 '+fmtDur(T.todayMs)+' · 累计 '+fmtDur(T.totalMs)+' · 已完成 '+T.rounds+' 个番茄</span></div>'
   +'<div class="bigtimer '+(T.mode==="break"?"break":"")+(T.running?"":" paused")+'">'+fmtMS(T.remainingMs)+'</div>'
   +'<div class="phase">'+(T.mode==="focus"?"🍅 专注中（"+T.focusMin+" 分钟）":"☕ 休息中（"+T.breakMin+" 分钟）")+(T.running?"":" · 已暂停")+'</div>'
   +'<div class="timerbar '+(T.mode==="break"?"brk":"")+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
   +'<div class="row" style="justify-content:center;margin-top:14px">'
   +'<button class="btn primary" id="tToggle" style="min-width:120px">'+(T.running?"⏸ 暂停":"▶ 开始")+'</button>'
   +'<button class="btn" id="tSkip">跳过本阶段</button>'
   +'<button class="btn" id="tReset">重置</button>'
   +'</div>'
   +'<div class="row" style="justify-content:center;margin-top:12px">'
   +presets.map(function(p){ return '<button class="btn '+(T.focusMin===p[0]&&T.breakMin===p[1]?"on":"")+'" data-preset="'+p[0]+','+p[1]+'">'+p[0]+" / "+p[1]+'</button>'; }).join("")
   +'</div>'
   +'<p class="muted" style="text-align:center;margin-top:12px">预设按钮是「专注分钟 / 休息分钟」。切到别的页签计时照常走，关掉页面再打开会按墙钟补算。</p>'
   +'</div>'
   +'<div class="card"><h3 style="margin-top:0">怎么用这个计时器</h3><ul class="tight">'
   +'<li><b>一个番茄 = 一组题</b>：25 分钟正好做完「逻辑填空 12 题」或「数字推理 14 题」这类一组，做完立刻在题目下写思路笔记。</li>'
   +'<li><b>休息别刷手机</b>：5 分钟起来走走、喝水，回来注意力能明显回升。</li>'
   +'<li><b>和限时组卷配合</b>：需要模拟银行 EPI 的模块独立计时，就用「刷题计划」里每天的「开始」，那里是另一套倒计时，不影响这个番茄钟。</li>'
   +'<li><b>今日/累计时长</b>只在「专注」阶段累计，休息不计入，能真实反映你刷了多久。</li>'
   +'</ul></div>';
  $("#tToggle").onclick=timerToggle;
  $("#tSkip").onclick=timerSkip;
  $("#tReset").onclick=timerReset;
  $$("#v-timer [data-preset]").forEach(function(b){
    b.onclick=function(){ const a=b.dataset.preset.split(","); timerPreset(Number(a[0]), Number(a[1])); };
  });
}
function rushTimeout(){
  const q=cur(); if(!q) return;
  const r=R(q.id); if(r.picked) return;
  const prevWrong = r.correct===false;
  r.timeout=true; r.correct=false; r.tries=(r.tries||0)+1;
  if(!prevWrong) r.wrong=(r.wrong||0)+1;
  r.ts=Date.now();
  S.ui.rushTimeouts=(S.ui.rushTimeouts||0)+1;
  save(true); renderTabs();
  toast("超时，本题记为错 → 下一题");
  rushQid=0; rushDeadline=0;
  next(1);
}
function timerTick(){                     // 每秒调用；用墙钟差值，后台标签页被节流也不会走慢
  const T=S.timer; if(!T) return;
  if(T.running){ const now=Date.now(); const dt=Math.min(Math.max(0,now-(T.lastAt||now)), 60000); if(dt>0) timerAdvance(dt); }
  if(rushOn() && rushQid && view==="practice"){
    const left=rushDeadline-Date.now();
    const el=document.getElementById("rushTimer");
    if(el){ el.textContent="⏱ "+fmtMS(Math.max(0,left)); el.classList.toggle("hot", left<=10000); }
    if(left<=0){ rushTimeout(); return; }
  }
  const chip=document.getElementById("timerChip");
  if(chip){ chip.textContent=timerChipText(); chip.className=T.running?"run":""; }
  if(view==="timer"){                                  // 计时页只更新数字，避免整页重绘
    const big=document.querySelector("#v-timer .bigtimer");
    if(big){ big.textContent=fmtMS(T.remainingMs);
      big.className="bigtimer "+(T.mode==="break"?"break":"")+(T.running?"":" paused"); }
    const bar=document.querySelector("#v-timer .timerbar>i");
    if(bar){ const total=(T.mode==="focus"?T.focusMin:T.breakMin)*60000;
      bar.style.width=Math.max(0,Math.min(100,100*(1-T.remainingMs/total))).toFixed(1)+"%"; }
  }
}

function openLightbox(srcOrNode){

/* ---------------- 一键刷新新题 ---------------- */
function refreshNew(n, topic){
  if(typeof EpiGen === "undefined"){ toast("出题器未加载"); return; }
  let made = EpiGen.refresh(n, topic ? [topic] : null);
  if(made.length < n){                       // 变体用尽时允许重来，保证「刷新」按钮永远有产出
    EpiGen.resetSeen();
    made = made.concat(EpiGen.refresh(n - made.length, topic ? [topic] : null));
  }
  if(!made.length){ toast("这次没生成出题，再点一次试试"); return; }
  made.forEach(q=>{ q.id = ++freshSeq; });
  freshQs = freshQs.concat(made);
  pruneFresh();
  saveFresh(); reindex(); save(); renderTabs();
  startSet(made.map(q=>q.id), { label: (topic ? topic + " 新题 " : "新生成 ") + made.length + " 题" });
  toast("已生成 " + made.length + " 道新题（答案均经反向验算）");
}

/* 地址栏 -> 界面：#/plan、#/practice/12 这类链接直接打开对应页面 */
function applyRoute(){
  const raw=String(location.hash||"").replace(/^#\/?/,"");
  const parts=raw.split("/");
  const known=TABS.map(t=>t[0]);
  const v=known.indexOf(parts[0])>=0?parts[0]:"list";
  const arg=parts[1];
  if(view==="practice" && v!=="practice") bankTime();
  if(v==="practice" && arg){
    const qid=Number(arg);
    if(BY_ID[qid] && (!cur() || cur().id!==qid)){
      queue=QS.map(q=>q.id);
      idx=queue.indexOf(qid);
      if(idx<0){ queue=[qid]; idx=0; }
      showTip=showAna=false;
    }
  }
  showView(v);
}

/* 把当前题的用时落账，切换题目/离开练习页前调用 */
function bankTime(){
  if(!activeQid) return;
  const r=R(activeQid), dt=Date.now()-qStart;
  if(dt>0 && dt<3600000) r.timeMs=(r.timeMs||0)+dt;
  qStart=Date.now(); activeQid=null;
}

function startSet(ids, opt){
  opt=opt||{};
  bankTime();
  queue=ids.slice(); idx=0;
  showTip=showAna=false; finished=false;
  examMode=!!opt.exam;
  setLimitMs=(opt.minutes||0)*60000; setRemainMs=setLimitMs;
  $("#v-practice").dataset.label=opt.label||"";
  go("practice");
  startTick();
}
function startTick(){
  if(tick) clearInterval(tick);
  if(!setLimitMs) { const t=$("#setTimer"); if(t) t.textContent=""; return; }
  tick=setInterval(()=>{
    setRemainMs-=1000;

      el.textContent="组卷剩余 "+fmtClock(setRemainMs);
      el.classList.toggle("hot", setRemainMs<=60000);
    }
    if(setRemainMs<=0){ clearInterval(tick); tick=null; toast("本组时间到，先看错在哪，别恋战"); }
  },1000);
}

  };

  activeQid=q.id; qStart=Date.now();

  else { rushQid=0; rushDeadline=0; }

let timerEl=null;
function pick(k){
  const q=cur(); const r=R(q.id);
  if(r.picked && !examMode) return;          // 练习模式已答，锁住避免误触
  if(r.picked===null) r.tries=(r.tries||0)+1;
  const prevWrong = r.correct===false;
  r.picked=k; r.correct=(k===q.answer); r.timeout=false;
  rushQid=0; rushDeadline=0;
  if(!r.correct && !prevWrong) r.wrong=(r.wrong||0)+1;   // 错误次数只累加，用于错题本
  r.ts=Date.now();
  save(); renderTabs();
  if(!examMode) showTip=true;                // 练习模式答完自动给标准思路
  renderPractice();
}
function next(d){
  if(idx<queue.length-1){ bankTime(); idx+=d; showTip=showAna=false; renderPractice(); }
  else { if(examMode) finishSet(); else toast("本组已到最后一题"); }
}
function finishSet(){
  bankTime();
  finished=true; examMode=false;
  const rows=queue.map(id=>{ const q=BY_ID[id], r=S.rec[id]||{}; const ok=r.picked===q.answer; return {q,r,ok}; });
  const done=rows.filter(x=>x.r.picked);
  const right=done.filter(x=>x.ok).length;
  $("#v-practice").innerHTML='<div class="card"><h2>本组结果</h2>'
    +'<div class="stats"><div class="stat"><b>'+right+'/'+done.length+'</b><span>答对/已答</span></div>'
    +'<div class="stat"><b>'+(done.length?Math.round(right/done.length*100):0)+'%</b><span>正确率</span></div>'
    +'<div class="stat"><b>'+(queue.length-done.length)+'</b><span>未作答</span></div></div>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" onclick="startSet(queue.slice(),{label:\'重做本组\'})">重做本组</button>'
    +'<button class="btn" onclick="startWrong()">重练错题</button>'
    +'<button class="btn" onclick="go(\'wrong\')">去错题本</button>'
    +'<button class="btn" onclick="go(\'data\')">看统计</button></div></div>'
    +'<table class="list"><thead><tr><th>题号</th><th>题型</th><th>我的答案</th><th>正确答案</th><th>结果</th><th>我的笔记</th></tr></thead><tbody>'
    +rows.map(x=>'<tr><td><a href="javascript:void(0)" onclick="jump('+x.q.id+')">'+x.q.id+'</a></td><td>'+esc(x.q.topic)+'</td><td>'+(x.r.picked||"—")+'</td><td>'+x.q.answer+'</td><td>'
      +(x.r.picked?(x.ok?'<span class="chip ok">对</span>':'<span class="chip bad">错</span>'):'<span class="chip">未答</span>')+'</td>'
      +'<td class="muted">'+esc((x.r.note||"").slice(0,40))+'</td></tr>').join("")
    +'</tbody></table>';
  if(timerEl) clearInterval(timerEl);
  if(tick) clearInterval(tick);
}
function jump(id){
  bankTime();
  const i=queue.indexOf(id);
  if(i<0){ queue=QS.map(q=>q.id); idx=queue.indexOf(id); if(idx<0){ queue=[id]; idx=0; } } else idx=i;
  showTip=showAna=false; go("practice");
}
function startRush(n){
  rushCfg().secs=45; save(true);
  const pool=QS.filter(q=>!isGen(q)).map(q=>q.id);          // 测评练习优先真题/原题
  startSet(selIds({k:"rand",n:n}), {label:"测评模式 "+n+" 题"});
  toast("测评模式：每题 45 秒，超时自动记为错");
}
function startHard(n){
  const hard=QS.filter(q=>q.diff===3 && isZhenti(q)).map(q=>q.id);
  const pool=hard.length>=n ? hard : QS.filter(q=>q.diff===3).map(q=>q.id);
  if(!pool.length) return toast("还没有难度标签，先导入真题库");
  for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  rushCfg().secs=0; save(true);
  startSet(pool.slice(0,n), {label:"只练难题 "+Math.min(n,pool.length)+" 题"});
}
function startRandom(n){ const a=QS.map(q=>q.id); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} startSet(a.slice(0,n),{label:"随机 "+n+" 题"}); }
function startWrong(){ const ids=Object.keys(S.rec).filter(isWrong).map(Number).sort((a,b)=>a-b); if(!ids.length){ toast("错题本是空的，先做几组题"); return; } startSet(ids,{label:"错题重练"}); }

let fModule="", fTopic="", fState="", fText="", fSrc="", fDiff="";
function renderList(){
  const modes=[["","全部"],["none","未做"],["bad","做错的"],["fav","收藏"],["doubt","存疑"],["note","有笔记"],["ana","无解析"]];
  const srcs=[["","全部来源"],["orig","仅原题（"+N_ORIG+"）"],["gen","构建期生成（"+N_GEN+"）"],["fresh","本机新生成（"+N_FRESH+"）"]];

  $("#v-list").innerHTML='<div class="card">'
   +'<div class="row">'
   +'<select id="fm"><option value="">全部模块</option>'+MODULES.map(m=>'<option '+(fModule===m?"selected":"")+'>'+esc(m)+'</option>').join("")+'</select>'
   +'<select id="ft"><option value="">全部题型</option>'+TOPICS.map(t=>'<option '+(fTopic===t?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select>'
   +'<select id="fs">'+srcs.map(([v,t])=>'<option value="'+v+'" '+(fSrc===v?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select>'
   +'<select id="fd"><option value="">全部难度</option><option value="3" '+(fDiff==="3"?"selected":"")+'>难（'+QS.filter(q=>q.diff===3).length+'）</option><option value="2" '+(fDiff==="2"?"selected":"")+'>中（'+QS.filter(q=>q.diff===2).length+'）</option><option value="1" '+(fDiff==="1"?"selected":"")+'>易（'+QS.filter(q=>q.diff===1).length+'）</option></select>'
   +'<input type="search" id="fq" placeholder="搜索题干关键词，如 比重 / 数列 / 工程" style="min-width:180px" value="'+esc(fText)+'">'
   +'<span class="spacer"></span>'
   +'<button class="btn" id="hardOnly" title="只筛难题">只练难题</button>'
   +'<button class="btn primary" id="startFiltered">开始这一组</button>'
   +'</div>'
   +'<div class="row" style="margin-top:10px">'+modes.map(([k,t])=>'<button class="btn '+(fState===k?"on":"")+'" data-st="'+k+'">'+t+'</button>').join("")+'</div>'
   +'</div>'
   +'<div class="row" style="margin:0 0 10px"><span class="muted" id="cnt"></span>'
   +'<span class="muted">· 原题 '+N_ORIG+' 道为手写真题/仿真题；构建期生成 '+N_GEN+' 道；本机新生成 '+N_FRESH+' 道（上限 '+MAX_FRESH+'）'+(N_ZHENTI?'；真题库 '+N_ZHENTI+' 道（本机导入）':'')+'</span></div>'
   +zhentiHint()
   +'<div class="grid" id="grid"></div>';
  const rebuild=()=>{ fModule=$("#fm").value; fTopic=$("#ft").value; fSrc=$("#fs").value; fDiff=$("#fd").value; fText=$("#fq").value.trim(); drawGrid(); };
  $("#fm").onchange=rebuild; $("#ft").onchange=rebuild; $("#fs").onchange=rebuild; $("#fd").onchange=rebuild;
  const ho=$("#hardOnly"); if(ho) ho.onclick=()=>{ fDiff="3"; fState=""; renderList(); };
  let qt=null; $("#fq").oninput=()=>{ clearTimeout(qt); qt=setTimeout(rebuild,180); };
  $$("[data-st]").forEach(b=>b.onclick=()=>{ fState=b.dataset.st; renderList(); });
  $("#startFiltered").onclick=()=>{ const ids=filtered().map(q=>q.id); if(!ids.length) return toast("这组筛选结果为空"); startSet(ids,{label:"筛选组"}); };
  drawGrid();
}
function filtered(){
  return QS.filter(q=>{
    if(fModule && q.module!==fModule) return false;
    if(fTopic && q.topic!==fTopic) return false;
    if(fSrc==="orig" && !isOrig(q)) return false;
    if(fSrc==="gen" && !isBuilt(q)) return false;
    if(fSrc==="fresh" && !isFresh(q)) return false;
    if(fSrc==="zhenti" && !isZhenti(q)) return false;
    if(fDiff && String(q.diff||0)!==fDiff) return false;
    if(fText && !(q.stem+" "+q.options.map(o=>o.t).join(" ")+" "+q.tip).includes(fText)) return false;
    const r=S.rec[q.id]||{};
    if(fState==="none" && r.picked) return false;
    if(fState==="bad" && !(r.wrong>0)) return false;
    if(fState==="fav" && !r.fav) return false;
    if(fState==="doubt" && !r.doubt) return false;
    if(fState==="note" && !(r.note&&r.note.trim())) return false;
    if(fState==="ana" && q.analysis) return false;
    return true;
  });
}
function drawGrid(){
  const list=filtered();
  $("#cnt").textContent="共 "+list.length+" 题"+(list.length===QS.length?"":"（已从全库 "+QS.length+" 题中筛出）");
  $("#grid").innerHTML=list.map(q=>{
    const r=S.rec[q.id]||{}; const st=stateOf(q.id);
    const dot=st==="ok"?'<span class="dot ok"></span>':st==="bad"?'<span class="dot bad"></span>':'<span class="dot"></span>';
    return '<div class="qcard" data-id="'+q.id+'">'
      +'<div class="top">'+dot+'<span class="no">'+q.id+'</span><span class="chip">'+esc(q.topic)+'</span>'
      +(isZhenti(q)?'<span class="chip warn">真题</span>':isFresh(q)?'<span class="chip ok">新生成</span>':isBuilt(q)?'<span class="chip acc">生成</span>':'')
      +(q.svg||(q.imgs&&q.imgs.length)?'<span class="chip">图</span>':'')+diffChip(q)+(q.analysis?'':'<span class="chip warn">无解析</span>')
      +(r.fav?'<span class="chip ok">★</span>':'')+(r.doubt?'<span class="chip warn">?</span>':'')+'</div>'
      +'<div class="stem">'+esc(stemText(q))+'</div>'
      +'<div class="bot">'+(r.picked?'<span class="chip '+(st==="ok"?"ok":"bad")+'">已答 '+r.picked+'</span>':'<span class="chip">未做</span>')
      +(r.wrong>0?'<span class="chip bad">错 '+r.wrong+' 次</span>':'')
      +((r.note&&r.note.trim())?'<span class="chip acc">有笔记</span>':'')+'</div>'
      +'</div>';
  }).join("");
  $$(".qcard").forEach(c=>c.onclick=()=>{ queue=filtered().map(q=>q.id); idx=Math.max(0,queue.indexOf(Number(c.dataset.id))); if(idx<0){queue=[Number(c.dataset.id)];idx=0;} showTip=showAna=false; examMode=false; setLimitMs=0; if(tick)clearInterval(tick); go("practice"); });
}

function wrongMD(ids){
  const L=["# 错题本（秋招行测题库）","","> 导出时间："+new Date().toLocaleString("zh-CN"),"> 共 "+ids.length+" 题",""];
  ids.forEach(id=>{ const q=BY_ID[id], r=S.rec[id]||{};
    L.push("## 第 "+id+" 题 · "+q.topic+"（错 "+r.wrong+" 次，我的答案 "+(r.picked||"—")+"，正确 "+q.answer+"）","");
    L.push("**题干**："+q.stem.replace(/\n/g," "),"");
    q.options.forEach(o=>L.push("- "+o.k+". "+o.t));
    L.push("","**标准思路**："+q.tip,"");
    if(q.analysis) L.push("**逐步解析**："+q.analysis,"");
    if(r.note&&r.note.trim()) L.push("**我的思路笔记**：",r.note,"");
    L.push("---","");
  });
  return L.join("\n");
}
function wrongCSV(ids){
  const rows=[["题号","模块","题型","正确答案","我的答案","错误次数","我的笔记"]];
  ids.forEach(id=>{ const q=BY_ID[id], r=S.rec[id]||{};
    rows.push([id,q.module,q.topic,q.answer,r.picked||"",r.wrong,(r.note||"").replace(/\n/g," ")]); });
  return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
}

function selIds(sel){
  if(!sel) return [];
  const pool = sel.orig ? QS.filter(isOrig) : QS;   // 21 天计划针对手写原题，生成题用于自由刷题
  if(sel.k==="r") return pool.filter(q=>q.id>=sel.a&&q.id<=sel.b).map(q=>q.id);
  if(sel.k==="m") return pool.filter(q=>q.module===sel.m).map(q=>q.id);
  if(sel.k==="t") return pool.filter(q=>q.topic===sel.t).map(q=>q.id);
  if(sel.k==="wrong") return Object.keys(S.rec).filter(isWrong).map(Number).sort((a,b)=>a-b);
  if(sel.k==="rand"){ const a=pool.map(q=>q.id); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,sel.n); }
  return pool.map(q=>q.id);
}

   +'<span class="spacer"></span>'
   +'<button class="btn" id="clrFresh">清空本机新题（'+N_FRESH+'）</button>'
   +'<button class="btn" id="clrRec">清空做题记录</button>'
   +'<button class="btn" id="clrNote">清空笔记</button>'
   +'<button class="btn" id="clrAll">全部重置</button>'
   +'</div></div>';
  $("#exp").onclick=()=>download("行测题库数据备份-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S,null,1), "application/json");
  $("#impBtn").onclick=()=>$("#imp").click();
  $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.rec) throw 0;
      const keepId=Object.keys(S.rec).some(k=>S.rec[k].note&&S.rec[k].note.trim());
      if(keepId && !confirm("当前已有笔记/进度，导入会覆盖。继续？")) return;
      S=Object.assign(blank(),o); save(true); go("data"); toast("导入成功"); }catch(err){ alert("文件格式不对，需要本页导出的 JSON"); } };
    rd.readAsText(f); };
  $("#expMD").onclick=()=>{ const w=Object.keys(S.rec).filter(isWrong).map(Number).sort((a,b)=>a-b);
    if(!w.length) return toast("错题本是空的"); download("错题本.md", wrongMD(w), "text/markdown;charset=utf-8"); };
  $("#expNotes").onclick=()=>{ const ids=QS.filter(q=>S.rec[q.id]&&S.rec[q.id].note&&S.rec[q.id].note.trim()).map(q=>q.id);
    if(!ids.length) return toast("还没写笔记");
    const L=["# 我的行测解题思路",""]; ids.forEach(id=>{ const q=BY_ID[id]; L.push("## 第 "+id+" 题 · "+q.topic,"",stemText(q),"",S.rec[id].note,"","---",""); });
    download("我的思路.md", L.join("\n"), "text/markdown;charset=utf-8"); };
  $("#clrFresh").onclick=()=>{ if(!confirm("清空本机刷新的 "+N_FRESH+" 道新题及其答题记录？（构建期题库不受影响）")) return;
    clearFresh(); renderData(); renderTabs(); toast("已清空本机新题"); };
  $("#clrRec").onclick=()=>{ if(!confirm("清空做题记录与错题（笔记保留）？")) return;
    Object.keys(S.rec).forEach(id=>{ S.rec[id].picked=null; S.rec[id].correct=null; S.rec[id].wrong=0; S.rec[id].tries=0; S.rec[id].timeMs=0; });
    save(true); renderData(); renderTabs(); toast("已清空做题记录"); };
  $("#clrNote").onclick=()=>{ if(!confirm("清空所有笔记？建议先导出。")) return;
    Object.keys(S.rec).forEach(id=>S.rec[id].note=""); save(true); renderData(); renderTabs(); toast("已清空笔记"); };
  $("#clrAll").onclick=()=>{ if(!confirm("全部重置（进度、错题、笔记、计划勾选）？此操作不可撤销。")) return;
    S=blank(); timerInit(); save(true); renderData(); renderTabs(); toast("已重置"); };
}

/* ---------------- 键盘 ---------------- */
document.addEventListener("keydown",e=>{
  if(view!=="practice") return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input") return;
  const k=e.key.toUpperCase();
  if(["1","2","3","4","A","B","C","D"].includes(k)){
    const m={"1":"A","2":"B","3":"C","4":"D"};
    pick(m[k]||k); e.preventDefault(); return;
  }
  if(e.key===" "||e.key==="Enter"){ showAna=!showAna; showTip=true; renderPractice(); e.preventDefault(); return; }
  if(e.key==="ArrowRight"){ next(1); e.preventDefault(); }
  if(e.key==="ArrowLeft"){ if(idx>0){idx--;showTip=showAna=false;renderPractice();} e.preventDefault(); }
  if(k==="F"){ const r=R(cur().id); r.fav=!r.fav; save(); renderPractice(); }
});

/* ---------------- 启动 ---------------- */
window.addEventListener("beforeunload",()=>{ bankTime(); save(true); });
window.addEventListener("hashchange",()=>{ if(!suppressHash) applyRoute(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ bankTime(); save(true); } });
/* 有网就是网站：注册 Service Worker 支持离线与「添加到主屏幕」；file:// 下自动跳过 */
if(typeof navigator!=="undefined" && navigator.serviceWorker && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
loadFresh();
if(zhentiState==="inlined") zhentiQs = BASE_QS.filter(isZhenti);   // 单文件版：真题已内嵌
reindex();
timerInit();
setInterval(timerTick, 1000);
document.title="秋招行测题库 · 银行 EPI "+QS.length+" 题";
refreshSubtitle();
tryLoadZhenti();
renderTabs();
if(location.hash) applyRoute(); else go("list");
</script>
</body>
