<style>
:root{
  --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --ink:#1f2328; --ink2:#5b6472; --ink3:#8b94a3;
  --acc:#2f6df6; --acc-soft:#eaf0ff; --ok:#15a34a; --ok-soft:#e8f7ee; --bad:#dc2626; --bad-soft:#fdecec;
  --warn:#c2740a; --warn-soft:#fdf3e3; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.7 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc)}
header{
  position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.hd{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px}
.brand .sub{font-weight:400;font-size:12px;color:var(--ink3);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{
  border:0;background:transparent;color:var(--ink2);padding:6px 11px;border-radius:9px;
  font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;
}
nav button:hover{background:#eef0f3;color:var(--ink)}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1120px;margin:0 auto;padding:18px 16px 80px}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--ink)}
.muted{color:var(--ink3);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
select,input[type=text],input[type=search],textarea{
  font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{width:100%;resize:vertical;line-height:1.7}
button.btn{
  font:inherit;font-size:13.5px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:7px 13px;border-radius:9px;
}
button.btn:hover{background:#f7f8fa}
button.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.btn.primary:hover{filter:brightness(1.06)}
button.btn.ghost{border-color:transparent;background:#eef0f3}
button.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef0f3;color:var(--ink2);
  white-space:nowrap;
}
.chip.acc{background:var(--acc-soft);color:var(--acc)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;line-height:1.3}
.stat span{font-size:12px;color:var(--ink3)}
/* 题库列表 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.qcard{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;
  display:flex;flex-direction:column;gap:7px;min-height:104px;
}
.qcard:hover{border-color:var(--acc);box-shadow:0 3px 14px rgba(47,109,246,.10)}
.qcard .top{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3)}
.qcard .no{font-weight:700;color:var(--ink);font-size:13px}
.qcard .stem{font-size:13.5px;color:var(--ink2);flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qcard .bot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d5d9e0;display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.half{background:var(--warn)}
/* 练习 */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qbody{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.material{background:#fbfbfd;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.material .mtitle{font-size:12px;color:var(--ink3);margin-bottom:6px}
.material p{margin:.35em 0}
.md-table{border-collapse:collapse;margin:8px 0;font-size:13.5px}
.md-table th,.md-table td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.md-table th{background:#f2f4f7;font-weight:600}
.fig{margin:6px 0 14px;text-align:center}
.fig svg{max-width:100%;height:auto}
.stem{font-size:16px;line-height:1.85;white-space:pre-wrap;margin-bottom:14px}
.stem strong{color:var(--ink);background:linear-gradient(transparent 62%,#ffe9a8 62%)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:15px;cursor:pointer;
  background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;width:100%;line-height:1.6;
}
.opt:hover{border-color:var(--acc);background:#fafbff}
.opt .k{
  flex:0 0 22px;height:22px;border-radius:50%;background:#eef0f3;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;margin-top:1px;
}
.opt.picked{border-color:var(--acc);background:var(--acc-soft)}
.opt.picked .k{background:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.verdict{margin:14px 0 0;font-size:14.5px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.reveal{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.box{border-radius:12px;padding:11px 14px;margin-top:10px;font-size:14.2px;line-height:1.8}
.box .lab{font-size:12px;display:block;margin-bottom:3px;letter-spacing:.5px}
.box.tip{background:var(--acc-soft)}
.box.tip .lab{color:var(--acc)}
.box.ana{background:#f7f8fa}
.box.ana .lab{color:var(--ink3)}
.note-wrap{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.note-wrap .lab{font-size:12.5px;color:var(--ink3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pager{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.hot{color:var(--bad)}
/* 表格 */
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
table.list th{font-weight:600;color:var(--ink2);background:#fafbfc;position:sticky;top:56px}
table.list tr:hover td{background:#fafbff}
.nbox{background:#f7f8fa;border-left:3px solid var(--acc);padding:10px 13px;border-radius:0 10px 10px 0;margin:8px 0;font-size:14px}
ul.tight{margin:.3em 0;padding-left:1.25em}
ul.tight li{margin:.22em 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:#fff}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.banner{background:var(--warn-soft);border:1px solid #f2ddb4;color:#7a4c07;border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:12px}
.kbd{font:12px/1.6 ui-monospace,Menlo,monospace;background:#eef0f3;border-radius:5px;padding:1px 5px;color:var(--ink2)}
@media (max-width:640px){
  .hd{gap:8px} nav{width:100%;margin-left:0;overflow-x:auto}
  .qbody{padding:14px}
  table.list th{position:static}
}
@media print{ header,nav,.pager,.reveal,.note-wrap{display:none} .view{display:block!important} }
</style>

"use strict";
const BANK = {"meta":{"title":"秋招行测题型题库与技巧（134 题）","count":697,"source":"/Users/wangsheng/Documents/deepseek-harness/default-workspace/秋招行测题库/source/行测题型题库与技巧.md","origCount":134,"genCount":563},"questions":[{"id":1,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"他还是个孩子的时候，总对前人的道理____，直到在社会上不断碰壁，才惊觉那些曾被当作玩笑的话字字戳心。","options":[{"k":"A","t":"不以为然"},{"k":"B","t":"不以为意"},{"k":"C","t":"嗤之以鼻"},{"k":"D","t":"置之不理"}],"svg":null,"tip":"成语辨析看「语意轻重 + 搭配对象」。","analysis":"「不以为意」= 没放在心上；「不以为然」= 不认为是对的；「嗤之以鼻」= 极端轻视，程度过重；「置之不理」= 搁在一边不理睬，多用于具体事物。文中与「当作玩笑」呼应，强调没当回事，选「不以为意」。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":2,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"我国新能源汽车产业仍处于____的阶段，未来增长空间巨大。","options":[{"k":"A","t":"方兴未艾"},{"k":"B","t":"如火如荼"},{"k":"C","t":"蒸蒸日上"},{"k":"D","t":"日新月异"}],"svg":null,"tip":"用「修饰对象 + 时态」排除。「处于……阶段」要求填一个描述发展阶段状态的词。","analysis":"「方兴未艾」指事物正在兴起发展、一时不会停止，可修饰「阶段」；「如火如荼」形容气势蓬勃的场面或活动；「蒸蒸日上」强调日益向上，多作谓语；「日新月异」强调变化快，不修饰「阶段」。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":3,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"这项政策的出台并非____，而是经过了充分的调研与论证。","options":[{"k":"A","t":"空穴来风"},{"k":"B","t":"无中生有"},{"k":"C","t":"突发奇想"},{"k":"D","t":"一蹴而就"}],"svg":null,"tip":"「并非……而是……」构成反义照应，空处应与「充分调研论证」相反。","analysis":"「突发奇想」指突然产生的想法，与「经过充分调研论证」正好相反；「空穴来风」易被望文生义误用；「无中生有」指凭空捏造，程度过重；「一蹴而就」指一下子成功，与「出台」不搭。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":4,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"面对错综复杂的国际形势，我们既要保持战略定力，也要____，及时调整应对策略。","options":[{"k":"A","t":"随机应变"},{"k":"B","t":"见风使舵"},{"k":"C","t":"顺势而为"},{"k":"D","t":"因势利导"}],"svg":null,"tip":"先看感情色彩，再比语义侧重。","analysis":"「见风使舵」含贬义，直接排除；「随机应变」= 根据情况灵活应对，与「及时调整策略」精准对应；「顺势而为」侧重顺应趋势；「因势利导」侧重引导别人，均不如 A 直接。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":5,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"老字号既要避免____、全盘否定传统，也要防止固步自封、拒绝创新。","options":[{"k":"A","t":"数典忘祖"},{"k":"B","t":"抱残守缺"},{"k":"C","t":"墨守成规"},{"k":"D","t":"因循守旧"}],"svg":null,"tip":"并列结构「既要避免 A、全盘否定传统，也要防止 B、拒绝创新」，A 必须与「否定传统」同义。","analysis":"只有「数典忘祖」（比喻忘掉自己本来的情况或事物的本源）对应「全盘否定传统」；B、C、D 都表示守旧，与「固步自封」同义，应填在第二空。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":6,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"法律的生命力在于实施。如果法律只是写在纸上，不能落到实处，就会____。","options":[{"k":"A","t":"形同虚设"},{"k":"B","t":"名存实亡"},{"k":"C","t":"一纸空文"},{"k":"D","t":"无济于事"}],"svg":null,"tip":"看词性能否直接作谓语，看主语适配。","analysis":"「形同虚设」= 形式上存在但不起作用，可作「法律……就会……」的谓语；「一纸空文」是名词性短语，应说「成为一纸空文」；「名存实亡」多用于机构、组织；「无济于事」指对事情没有帮助。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":7,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"与其在信息的洪流中____，不如静下心来读一本好书。","options":[{"k":"A","t":"随波逐流"},{"k":"B","t":"人云亦云"},{"k":"C","t":"不知所措"},{"k":"D","t":"目不暇接"}],"svg":null,"tip":"抓比喻义。「信息的洪流」是比喻，要求选一个含「被裹挟、失去主见」义的词。","analysis":"「随波逐流」比喻没有主见、跟着别人走，与「洪流」形成语义呼应；「人云亦云」侧重说话没主见；「不知所措」侧重慌乱；「目不暇接」指东西太多来不及看。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":8,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"科技的发展让世界变得越来越小，但人与人之间的心理距离却未必____。","options":[{"k":"A","t":"亦步亦趋"},{"k":"B","t":"同步缩短"},{"k":"C","t":"同日而语"},{"k":"D","t":"等量齐观"}],"svg":null,"tip":"逻辑照应——前文说空间距离「变小」，转折后说的是心理距离，空处应是「变小/缩短」的同类表达。","analysis":"「同步缩短」与前文「变小」构成照应；「同日而语」「等量齐观」是「把两者放在一起比较」的意思，不能作「距离」的谓语；「亦步亦趋」指模仿追随，与距离无关。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":9,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"面对媒体的追问，他始终____，既不回避问题，也不轻易表态。","options":[{"k":"A","t":"泰然自若"},{"k":"B","t":"不置可否"},{"k":"C","t":"守口如瓶"},{"k":"D","t":"模棱两可"}],"svg":null,"tip":"用后文的解释性分句反推——「不轻易表态」就是对空处的解释。","analysis":"「不置可否」= 不说对也不说不对，正好对应「不轻易表态」；「模棱两可」含「两面讨好、回避表态」，与「不回避问题」矛盾；「守口如瓶」侧重保密；「泰然自若」侧重镇定。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":10,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"在人工智能快速发展的今天，与其担心被替代，不如____，主动学习新技能。","options":[{"k":"A","t":"未雨绸缪"},{"k":"B","t":"亡羊补牢"},{"k":"C","t":"当机立断"},{"k":"D","t":"因势利导"}],"svg":null,"tip":"「与其……不如……」提示行动的时间性——要在事情发生前准备。","analysis":"「未雨绸缪」= 事先做好准备，对应「主动学习新技能」；「亡羊补牢」是事后补救；「当机立断」侧重果断；「因势利导」侧重引导。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":11,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"文化遗产保护不能____，把真古迹拆掉去建假古董，反而会破坏其历史价值。","options":[{"k":"A","t":"喧宾夺主"},{"k":"B","t":"越俎代庖"},{"k":"C","t":"舍本逐末"},{"k":"D","t":"画蛇添足"}],"svg":null,"tip":"找空处后面的解释句，「拆真古迹建假古董」已经给出答案的含义。","analysis":"丢弃根本（真古迹）、追求末节（假古董）正是「舍本逐末」；「喧宾夺主」指客人压过主人；「越俎代庖」指越权办事；「画蛇添足」指多此一举。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":12,"module":"言语理解与表达","topic":"逻辑填空","source":"","stem":"他仅凭几个个案就得出普遍性结论，难免有____之嫌。","options":[{"k":"A","t":"以偏概全"},{"k":"B","t":"穿凿附会"},{"k":"C","t":"断章取义"},{"k":"D","t":"生吞活剥"}],"svg":null,"tip":"「几个个案 → 普遍结论」是典型的「部分推全体」错误。","analysis":"「以偏概全」= 用片面的情况概括全部，与题干逻辑完全一致；「断章取义」指孤立截取片段；「穿凿附会」指生硬解释；「生吞活剥」指生硬照搬。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":13,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"许多人把「自律」理解为对自己狠一点，于是给自己排满日程、压缩睡眠、拒绝一切娱乐。但真正可持续的自律，靠的不是意志力的持续对抗，而是把目标拆解成足够小、能够获得即时反馈的行动。当一件事带来的正反馈足够频繁，坚持就不再需要咬牙。\n这段文字意在说明：","options":[{"k":"A","t":"自律需要强大的意志力"},{"k":"B","t":"应重新理解自律的实现方式"},{"k":"C","t":"娱乐会影响自律的效果"},{"k":"D","t":"日程过满会导致效率下降"}],"svg":null,"tip":"转折词「但」后是重点，尾句是对重点的进一步解释。","analysis":"文段先给出常见误解，再用「但」引出真正观点——自律靠的是拆解目标与即时反馈，而非意志力对抗，即需要重新理解自律的实现方式。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":14,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"城市更新不是把老街区推倒重建，而是要在保留城市记忆的前提下改善居民生活。一些地方急于求成，把历史街区改造成千篇一律的商业街，结果是居民搬走了、原住民的生活场景消失了，游客来一次就不会再来。这样的更新，看似改变了面貌，实则抽走了城市的灵魂。\n这段文字主要强调：","options":[{"k":"A","t":"城市更新应兼顾保护与民生"},{"k":"B","t":"商业街同质化严重"},{"k":"C","t":"游客对城市更新影响很大"},{"k":"D","t":"老街区改造难度大"}],"svg":null,"tip":"「不是……而是……」中，「而是」之后是正面观点，即主旨。","analysis":"文段的核心句是「在保留城市记忆的前提下改善居民生活」，后文是反面例证。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":15,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"有研究发现，长期使用社交媒体的人更容易高估他人的生活质量，从而产生焦虑。但研究者也提醒，这一结论建立在自我报告数据之上，样本以年轻人为主，因果关系尚不能确定。换句话说，社交媒体与焦虑之间更可能是相互影响，而非单向的因果链条。\n根据这段文字，下列说法正确的是：","options":[{"k":"A","t":"社交媒体必然导致焦虑"},{"k":"B","t":"该研究结论具有绝对可靠性"},{"k":"C","t":"二者关系可能是双向的"},{"k":"D","t":"年轻人比其他群体更焦虑"}],"svg":null,"tip":"细节判断题先划选项关键词（必然、绝对、双向），再回原文逐一比对，警惕绝对化。","analysis":"原文明确说「更可能是相互影响，而非单向因果」，故 C 正确；A「必然」、B「绝对可靠」均与原文的谨慎表述矛盾；D 属无中生有。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":16,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"一项新技术从实验室走向市场，往往要经历漫长的过程。以锂电池为例，其原理早在 20 世纪 70 年代就被提出，但直到材料、工艺、成本控制等环节逐一突破，才真正实现大规模商用。这提醒我们，技术创新的价值不仅在于「从 0 到 1」的突破，也在于「从 1 到 100」的产业化能力。\n这段文字意在强调：","options":[{"k":"A","t":"锂电池的商用过程漫长"},{"k":"B","t":"产业化能力同样重要"},{"k":"C","t":"实验室研究价值有限"},{"k":"D","t":"技术突破依赖偶然因素"}],"svg":null,"tip":"结尾的「这提醒我们」是主旨句标志。","analysis":"尾句「不仅……也……」中，「也」之后是被强调的部分——产业化能力。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":17,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"有人担心 AI 会取代大量岗位。但历史经验表明，技术进步在消灭部分岗位的同时，也会创造新的岗位，只是新岗位需要的技能与旧岗位不同。真正的风险不在于「没有工作」，而在于劳动者的技能更新速度跟不上岗位结构的变化。\n这段文字的核心观点是：","options":[{"k":"A","t":"AI 不会造成失业"},{"k":"B","t":"技术进步的岗位效应是中性的"},{"k":"C","t":"应重视劳动者技能更新"},{"k":"D","t":"新岗位的技能要求更低"}],"svg":null,"tip":"「真正的风险在于……」是作者强调的重点所在。","analysis":"文段的重心落在最后一句的「技能更新速度跟不上结构变化」，因此对策指向劳动者技能更新。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":18,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"传统村落的价值，不只在于建筑本身，更在于附着其上的生活方式、民俗信仰与人际网络。如果只把老房子修缮一新，却让原住民迁走，村落就成了没有生活气息的「标本」。保护传统村落，本质上是保护一种仍在延续的生活。\n这段文字主要说明：","options":[{"k":"A","t":"传统建筑修缮技术难度大"},{"k":"B","t":"村落保护要留住人和生活"},{"k":"C","t":"民俗信仰正在消失"},{"k":"D","t":"原住民不愿留在村落"}],"svg":null,"tip":"抓「不只……更……」的递进结构，递进后是重点；尾句是对重点的总结。","analysis":"文段强调村落价值在于生活与人，保护的本质是保护延续的生活。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":19,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"很多人以为写作的难点在于「写得漂亮」，于是热衷于收集金句、模仿文风。但写作真正的门槛在于想清楚：你到底要解决什么问题、说给谁听、凭什么让人信服。表达技巧只是最后一层包装，思考的清晰度才是地基。\n这段文字意在说明：","options":[{"k":"A","t":"金句积累没有意义"},{"k":"B","t":"写作的核心是思考清晰"},{"k":"C","t":"文风模仿容易失败"},{"k":"D","t":"表达技巧难以掌握"}],"svg":null,"tip":"转折 + 比喻（「地基」喻指基础、根本）。","analysis":"「思考的清晰度才是地基」表明作者认为思考清晰是写作的根本。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":20,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"有观点认为，加班时间长就等于工作努力。事实上，时间投入只是努力的必要条件之一，方向是否正确、方法是否高效、产出是否真正解决问题，才决定努力的价值。用「时长」衡量努力，容易让真正高效的人被低估，也容易纵容低效的忙碌。\n根据这段文字，作者对「以时长衡量努力」的态度是：","options":[{"k":"A","t":"完全赞同"},{"k":"B","t":"部分认同"},{"k":"C","t":"明确反对"},{"k":"D","t":"未作评价"}],"svg":null,"tip":"态度题看评价性词语。「容易让……被低估」「纵容低效」都是负面评价。","analysis":"作者明确指出这种衡量方式的两种危害，态度是反对。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":21,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"博物馆的数字化不只是把展品拍成照片放到网上，而是要用技术重建观众与文物之间的连接：让不能到现场的人看到细节，让到现场的人获得更丰富的解释，让研究者获得可检索的数据。技术是手段，观众对文明的理解才是目的。\n这段文字意在强调：","options":[{"k":"A","t":"数字化应服务于理解与连接"},{"k":"B","t":"线上展览将取代线下展览"},{"k":"C","t":"文物拍照技术要求高"},{"k":"D","t":"研究者是数字化最大受益者"}],"svg":null,"tip":"「不只是……而是……」重点在「而是」后；尾句再次点明目的。","analysis":"文段反复强调数字化要重建「连接」、服务于「理解」。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":22,"module":"言语理解与表达","topic":"片段阅读","source":"","stem":"一个人能否坚持运动，往往不取决于意志力强弱，而取决于运动是否被嵌入了日常生活：把跑鞋放在门口、把健身安排在与通勤同一条路线上、把运动变成与朋友见面的方式。当行为不需要额外决策，坚持的成本就大幅降低。\n这段文字主要说明：","options":[{"k":"A","t":"意志力对坚持运动没有作用"},{"k":"B","t":"降低决策成本有助于坚持"},{"k":"C","t":"与朋友一起运动效果最好"},{"k":"D","t":"通勤路线影响运动效果"}],"svg":null,"tip":"尾句是总结句，「不需要额外决策 → 成本降低」即主旨。","analysis":"文段列举的做法都是为了让运动「不需要额外决策」，从而降低坚持成本。B 是对文段的概括；A 表述绝对。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"","moduleTip":"","src":"orig"},{"id":23,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"通过这次培训，使我的业务能力有了明显提高。"},{"k":"B","t":"是否重视安全生产，是企业可持续发展的重要保证。"},{"k":"C","t":"为了弄明白这个问题，他查阅了大量的文献资料。"},{"k":"D","t":"这次会议大约有一百人左右参加。"}],"svg":null,"tip":"看到「通过……使……」「是否……是……」「大约……左右」先按三大高发错误排查。","analysis":"A 项「通过」与「使」连用导致主语残缺，删去其一；B 项「是否」是两面，「重要保证」是一面，两面对一面；D 项「大约」与「左右」重复赘余。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":24,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"他的写作水平明显改进了。"},{"k":"B","t":"我们要及时纠正并发现工作中的问题。"},{"k":"C","t":"这本书对我很感兴趣。"},{"k":"D","t":"随着城市化进程加快，城市交通拥堵问题日益突出。"}],"svg":null,"tip":"判搭配（主谓、动宾）、判语序（动作先后）、判主客关系。","analysis":"A 项「水平」应与「提高」搭配，「改进」应搭配方法、技术；B 项语序不当，应先发现后纠正；C 项主客颠倒，应为「我对这本书很感兴趣」。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":25,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"为了防止这类事故不再发生，我们加强了安全管理。"},{"k":"B","t":"能否取得好成绩，取决于平时的努力。"},{"k":"C","t":"这次活动的目的是为了增强团队凝聚力。"},{"k":"D","t":"他不但学习好，而且品德也很好，深受同学们喜爱。"}],"svg":null,"tip":"否定词数一数（防止……不……=双重否定表肯定），两面词配两面词。","analysis":"A 项「防止……不再发生」把意思说反；B 项「能否」是两面，「平时努力」是一面；C 项「目的是」与「为了」句式杂糅。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":26,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"我国棉花的生产，长期不能自给。"},{"k":"B","t":"这次学术会议，与会者就人工智能的发展前景交换了广泛的意见。"},{"k":"C","t":"在老师的帮助下，使我的英语成绩提高很快。"},{"k":"D","t":"科学家们发现，这种植物含有多种对人体有益的成分。"}],"svg":null,"tip":"紧缩主干法——先划出「谁 + 做什么」，搭配问题会立刻暴露。","analysis":"A 项主干是「生产不能自给」，主谓搭配不当，应改为「我国棉花长期不能自给」；B 项状语位置不当，「广泛」应修饰「交换」；C 项因「在……下」与「使」连用缺主语。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":27,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句表意明确、没有语病的一句是：","options":[{"k":"A","t":"三个学校的老师参加了这次培训。"},{"k":"B","t":"他背着总经理和副总经理偷偷地把这笔钱存入了银行。"},{"k":"C","t":"无论遇到多大困难，我们都要坚持下去。"},{"k":"D","t":"昨天下午，两个报社的记者来采访了他。"}],"svg":null,"tip":"数量词 + 名词的修饰范围、「和」字连接的对象，都是歧义高发点。","analysis":"A 项歧义（「三个」修饰学校还是老师）；B 项歧义（背着的是「总经理」还是「总经理和副总经理」）；D 项歧义（「两个」修饰报社还是记者）。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":28,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"这次比赛，他发挥出了自己的充分水平。"},{"k":"B","t":"他对自己能否考上理想的大学充满了信心。"},{"k":"C","t":"为了防止疫情扩散，机场采取了严格的检测措施。"},{"k":"D","t":"通过这次社会实践，让我们增长了见识。"}],"svg":null,"tip":"状语位置、两面词、缺主语三大考点集中在一题里。","analysis":"A 项语序不当，应为「充分发挥出自己的水平」；B 项「能否」是两面，「充满信心」是一面；D 项「通过……让……」缺主语。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"六大高频病因：①成分残缺（尤其「通过……使……」缺主语）②搭配不当 ③语序不当 ④句式杂糅 ⑤两面对一面 ⑥否定不当/重复赘余。","moduleTip":"","src":"orig"},{"id":29,"module":"言语理解与表达","topic":"病句辨析","source":"","stem":"下列各句中没有语病的一句是：","options":[{"k":"A","t":"他之所以取得如此成就，是因为他长期坚持努力的结果。"},{"k":"B","t":"这本书的内容深入浅出，深受读者所欢迎。"},{"k":"C","t":"随着互联网的普及，人们获取信息的方式发生了巨大变化。"},{"k":"D","t":"能否养成良好的阅读习惯，是提高语文素养的重要途径。"}],"svg":null,"tip":"句式杂糅的识别标志——两种句式各留一半，如「之所以……是因为……的结果」「深受……所……」。","analysis":"A 项杂糅，应说「是因为他长期坚持努力」或「是长期坚持努力的结果」；B 项杂糅，应说「深受读者欢迎」或「为读者所欢迎」；D 项两面对一面。","answer":"C","materialTitle":"","materialHtml":" {"k":"A","t":"③①②④⑤"},{"k":"B","t":"③②①④⑤"},{"k":"C","t":"③①④②⑤"},{"k":"D","t":"①②③④⑤"}],"svg":null,"tip":"概念应在解释之前，举例应在解释之后。","analysis":"③提出问题，①引出「微习惯」概念，②解释原理，④举例，⑤说明效果。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"通用四步：定首句（引出话题/下定义）→ 定尾句（结论/对策）→ 用指代词与关联词捆绑 → 代入验证。","moduleTip":"","src":"orig"},{"id":38,"module":"言语理解与表达","topic":"语句排序与衔接","source":"","stem":"将以下 5 个句子重新排列，语序正确的是：\n①因此，评价一项公共政策不能只看短期数据\n②公共政策的效果往往需要较长时间才能显现\n③有些政策在实施初期甚至会带来阵痛\n④而要看它是否解决了根本问题\n⑤只有经过一段时间的观察，才能作出客观判断","options":[{"k":"A","t":"②③⑤①④"},{"k":"B","t":"②③①④⑤"},{"k":"C","t":"②①③⑤④"},{"k":"D","t":"③②⑤①④"}],"svg":null,"tip":"「不能……而要看……」是一组关联结构，①④必须相邻且 ④ 在后。","analysis":"②提出观点「需要较长时间」，③让步补充，⑤进一步说明需观察，①④用关联结构给出结论。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"通用四步：定首句（引出话题/下定义）→ 定尾句（结论/对策）→ 用指代词与关联词捆绑 → 代入验证。","moduleTip":"","src":"orig"},{"id":39,"module":"言语理解与表达","topic":"语句排序与衔接","source":"","stem":"将以下 5 个句子重新排列，语序正确的是：\n①这种「信息茧房」会让人逐渐失去接触不同观点的机会\n②算法会根据用户的浏览记录推荐相似内容\n③长此以往，人的认知会变得越来越狭窄\n④推荐系统在提升信息获取效率的同时，也带来了隐忧\n⑤用户看到的往往是符合自己偏好的信息","options":[{"k":"A","t":"④②⑤①③"},{"k":"B","t":"②⑤①③④"},{"k":"C","t":"④⑤②①③"},{"k":"D","t":"④②①⑤③"}],"svg":null,"tip":"「这种……」是对上一句名词的复指，①必须紧跟提出「信息茧房」的句子。","analysis":"④总起并点出隐忧，②⑤讲机制，①用「这种信息茧房」承接并指出后果，③进一步递进后果。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"通用四步：定首句（引出话题/下定义）→ 定尾句（结论/对策）→ 用指代词与关联词捆绑 → 代入验证。","moduleTip":"","src":"orig"},{"id":40,"module":"言语理解与表达","topic":"语句排序与衔接","source":"","stem":"将以下 5 个句子重新排列，语序正确的是：\n①这就要求我们重新审视「效率」的含义\n②新技术的应用大幅缩短了工作时间\n③把节省下来的时间用于休息与创造\n④但技术带来的时间红利并不必然转化为幸福感\n⑤而不是投入到更多的加班之中","options":[{"k":"A","t":"②④①③⑤"},{"k":"B","t":"②①④③⑤"},{"k":"C","t":"④②①③⑤"},{"k":"D","t":"②④③①⑤"}],"svg":null,"tip":"「但」表转折，转折后应是对前文正面表述的修正。","analysis":"②讲技术红利，④用「但」转折指出问题，①给出对策方向，③⑤具体说明如何重新定义效率。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"通用四步：定首句（引出话题/下定义）→ 定尾句（结论/对策）→ 用指代词与关联词捆绑 → 代入验证。","moduleTip":"","src":"orig"},{"id":41,"module":"数量关系","topic":"数字推理","source":"" ？","options":[{"k":"A","t":"64"},{"k":"B","t":"70"},{"k":"C","t":"74"},{"k":"D","t":"80"}],"svg":null,"tip":"遇到「至少」，用「总数 − 对立面」比分类讨论快得多。","analysis":"C(9,3)=84，全是男生 C(5,3)=10，故 84−10=74。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":60,"module":"数量关系","topic":"数学运算","source":"","stem":"从 1 到 10 中随机抽取两个不同的数，其和为偶数的概率是多少？","options":[{"k":"A","t":"4/9"},{"k":"B","t":"1/2"},{"k":"C","t":"5/9"},{"k":"D","t":"2/5"}],"svg":null,"tip":"和为偶数 ⟺ 两数同奇或同偶，按「分类计数÷总数」处理。","analysis":"奇数、偶数各 5 个，同奇偶取法 C(5,2)+C(5,2)=20，总取法 C(10,2)=45，概率 20/45=4/9。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":61,"module":"数量关系","topic":"数学运算","source":"","stem":"某班 50 人，参加数学竞赛 30 人，参加物理竞赛 25 人，两项都参加 10 人，两项都没参加的有多少人？","options":[{"k":"A","t":"3"},{"k":"B","t":"5"},{"k":"C","t":"8"},{"k":"D","t":"10"}],"svg":null,"tip":"两集合容斥公式：A∪B = A + B − A∩B。","analysis":"至少参加一项 = 30+25−10=45，都没参加 = 50−45=5。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":62,"module":"数量关系","topic":"数学运算","source":"","stem":"5 个互不相同的正整数之和为 100，其中最大的数最大可以是多少？","options":[{"k":"A","t":"88"},{"k":"B","t":"89"},{"k":"C","t":"90"},{"k":"D","t":"91"}],"svg":null,"tip":"求「最大数的最大值」→ 让其余数尽可能小；求「最大数的最小值」→ 让各数尽可能接近。","analysis":"其余 4 个数取最小且互不相同：1、2、3、4，和为 10，最大数 = 100−10=90。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":63,"module":"数量关系","topic":"数学运算","source":"","stem":"一片草地可供 10 头牛吃 20 天，或供 15 头牛吃 10 天。若供 25 头牛，可吃多少天？","options":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"6"},{"k":"D","t":"8"}],"svg":null,"tip":"牛吃草是「消长问题」——原有草量 + 每天生长量×天数 = 牛数×天数。","analysis":"设每头牛每天吃 1 份，草每天长 x 份，原有 y 份。y+20x=200，y+10x=150，解得 x=5，y=100。25 头时：100+5t=25t → t=5。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":64,"module":"数量关系","topic":"数学运算","source":"","stem":"父亲今年 40 岁，儿子 10 岁，多少年后父亲的年龄是儿子的 2 倍？","options":[{"k":"A","t":"10"},{"k":"B","t":"15"},{"k":"C","t":"20"},{"k":"D","t":"25"}],"svg":null,"tip":"年龄问题用「差不变 + 方程」；此题也可直接代入选项验证。","analysis":"设 x 年后，40+x=2(10+x)，解得 x=20。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":65,"module":"数量关系","topic":"数学运算","source":"","stem":"一条 200 米长的路，每隔 8 米种一棵树，两端都种，共种多少棵？","options":[{"k":"A","t":"24"},{"k":"B","t":"25"},{"k":"C","t":"26"},{"k":"D","t":"27"}],"svg":null,"tip":"不封闭路段两端都种：棵数 = 段数 + 1；一端种：棵数 = 段数；两端都不种：棵数 = 段数 − 1；封闭路线：棵数 = 段数。","analysis":"段数 = 200÷8=25，两端都种故 25+1=26 棵。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":66,"module":"数量关系","topic":"数学运算","source":"","stem":"3 个空瓶可换 1 瓶水，小明买了 10 瓶水，最多能喝到多少瓶？","options":[{"k":"A","t":"13"},{"k":"B","t":"14"},{"k":"C","t":"15"},{"k":"D","t":"16"}],"svg":null,"tip":"空瓶换水可用「借瓶」思想把价值榨干，也可以直接用公式：总量 = N + N/(m−1) 的取整形式。","analysis":"10 瓶 → 10 空瓶换 3 瓶余 1 空瓶；喝完 4 空瓶换 1 瓶余 1 空瓶；喝完 2 空瓶，借 1 个空瓶再换 1 瓶，喝完把空瓶还回。共 10+3+1+1=15 瓶。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":67,"module":"数量关系","topic":"数学运算","source":"","stem":"用 20% 的盐水和 5% 的盐水混合，配成 15% 的盐水，两种盐水质量比是多少？","options":[{"k":"A","t":"1∶2"},{"k":"B","t":"2∶1"},{"k":"C","t":"3∶1"},{"k":"D","t":"1∶3"}],"svg":null,"tip":"十字交叉法——混合后浓度与两侧浓度之差，交叉即为质量比。","analysis":"(20%−15%)∶(15%−5%)=5∶10=1∶2… 注意交叉对应关系：高浓度溶液质量∶低浓度溶液质量 =（15−5）∶（20−15）=10∶5=2∶1。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"核心方法：赋值法（工程/行程设总量）、比例法、代入排除、倍数特性、方程法、十字交叉、构造法。","moduleTip":"","src":"orig"},{"id":68,"module":"判断推理","topic":"定义判断","source":"真题","stem":"操作性条件作用是指通过奖励或惩罚来控制动物行为，即用奖励或惩罚刺激相应反应。\n根据上述定义，下列**不属于**操作性条件作用的是：","options":[{"k":"A","t":"白鼠在斯金纳箱中压杆就会掉落食物，之后白鼠会自发一直压杆"},{"k":"B","t":"鸽子啄起蓝色纸片时给予食物，之后鸽子能从多种颜色中分辨出蓝色"},{"k":"C","t":"每次主人拿来食物时，狗闻到食物香气就会分泌唾液"},{"k":"D","t":"小鸡每按一次按钮就能避免电击，之后小鸡会持续按压按钮"}],"svg":null,"tip":"抓核心要件——「通过自身行为获得奖励或避免惩罚」。","analysis":"C 项是铃声/气味与食物反复关联形成的经典条件反射，动物没有做出「操作行为」来换取结果，不符合操作性条件作用。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":69,"module":"判断推理","topic":"定义判断","source":"","stem":"沉没成本效应是指人们因为已经投入了时间、金钱或精力，即使明知继续下去不划算，仍倾向于继续投入。\n根据上述定义，下列最符合沉没成本效应的是：","options":[{"k":"A","t":"小王货比三家后选择了最便宜的商品"},{"k":"B","t":"小李买了电影票，看了半小时发现很难看，仍坚持看完"},{"k":"C","t":"小张因为喜欢某品牌而反复购买其产品"},{"k":"D","t":"小赵每月固定存钱用于养老"}],"svg":null,"tip":"关键词是「已投入 + 明知不划算 + 仍继续」。","analysis":"B 项票钱已花（沉没成本），明知难看仍坚持看完，完全符合；A 是理性比价；C 是品牌偏好；D 是理性储蓄。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":70,"module":"判断推理","topic":"定义判断","source":"","stem":"旁观者效应是指当现场有多人在场时，个体出手帮助他人的可能性反而降低，责任被分散。\n根据上述定义，下列最符合旁观者效应的是：","options":[{"k":"A","t":"一位热心市民独自救起落水儿童"},{"k":"B","t":"志愿者团队分工协作完成救援"},{"k":"C","t":"有人在网上发起募捐，很快募集到善款"},{"k":"D","t":"一位老人摔倒，围观者众多却迟迟无人上前施救"}],"svg":null,"tip":"两个要件必须同时满足——「多人在场」+「帮助行为减少」。","analysis":"D 项人多反而无人施救，是典型的责任分散；A 是单独一人施救，与定义相反；B 是团队协作；C 是线上募捐，不涉及现场旁观。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":71,"module":"判断推理","topic":"定义判断","source":"","stem":"光环效应是指人们对他人的某一突出特征形成好印象后，会倾向于对其整体作出正面评价。\n根据上述定义，下列最符合光环效应的是：","options":[{"k":"A","t":"因为某演员外形出众，观众便认为他演技、人品都很优秀"},{"k":"B","t":"因为一次迟到，经理认定该员工工作态度差"},{"k":"C","t":"面试官按统一标准给每位应聘者打分"},{"k":"D","t":"消费者因为价格便宜而购买某商品"}],"svg":null,"tip":"辨清方向——光环效应是「一好 → 全好」；若「一坏 → 全坏」则是尖角效应（负光环）。","analysis":"A 项由外形好推及演技、人品都好，符合；B 是负向的以点带面；C 是标准化评价；D 是价格决策。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":72,"module":"判断推理","topic":"定义判断","source":"","stem":"破窗效应是指环境中的不良现象如果被放任存在，会诱使人们仿效，甚至变本加厉。\n根据上述定义，下列最符合破窗效应的是：","options":[{"k":"A","t":"一家店铺因为卫生差被罚款后立即整改"},{"k":"B","t":"学校严格执行校规，学生违纪现象很少"},{"k":"C","t":"一面墙上出现涂鸦未被及时清理，很快整面墙被涂得乱七八糟"},{"k":"D","t":"公园增设垃圾桶后，乱扔垃圾的人减少了"}],"svg":null,"tip":"定义强调「不良现象未被制止 → 被仿效扩大」。","analysis":"C 项涂鸦未被清理，导致仿效扩散，符合；A 是惩罚后的整改；B 是严格管理抑制不良行为；D 是改善设施减少不良行为。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":73,"module":"判断推理","topic":"定义判断","source":"","stem":"责任分散是指当一项任务由多人共同承担时，每个人的责任感反而减弱。\n根据上述定义，下列最符合责任分散的是：","options":[{"k":"A","t":"项目经理将任务明确分配到个人并设定截止时间"},{"k":"B","t":"小组作业中，成员普遍认为「总会有人做」，结果无人主动推进"},{"k":"C","t":"团队成员互相监督，提前完成任务"},{"k":"D","t":"领导亲自负责关键环节"}],"svg":null,"tip":"关键词是「责任无明确归属 → 个体责任感下降」。","analysis":"B 项责任未明确到人，导致人人推诿，符合定义；A、D 是明确责任，C 是互相监督，都与定义相反。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":74,"module":"判断推理","topic":"定义判断","source":"","stem":"锚定效应是指人们在做判断时，容易受到最初接触到的信息（锚点）的影响。\n根据上述定义，下列最符合锚定效应的是：","options":[{"k":"A","t":"顾客根据商品的实际使用价值决定是否购买"},{"k":"B","t":"消费者货比三家后选择性价比最高的商品"},{"k":"C","t":"商家根据成本制定售价"},{"k":"D","t":"商品先标价 999 元再打折到 599 元，顾客觉得很划算"}],"svg":null,"tip":"找「最初信息 → 后续判断被牵引」的链条。","analysis":"D 项原价 999 元成为锚点，使 599 元显得便宜，符合；A、B 是理性决策；C 是成本定价，不涉及判断偏差。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":75,"module":"判断推理","topic":"定义判断","source":"","stem":"棘轮效应是指消费习惯一旦形成便具有不可逆性，容易向上调整却难以向下调整。\n根据上述定义，下列最符合棘轮效应的是：","options":[{"k":"A","t":"收入提高后，家庭立即增加储蓄"},{"k":"B","t":"消费者根据预算严格控制支出"},{"k":"C","t":"收入下降后，家庭仍维持高消费水平，难以压缩开支"},{"k":"D","t":"企业根据市场变化调整产品价格"}],"svg":null,"tip":"抓住「由俭入奢易、由奢入俭难」的不可逆特征。","analysis":"C 项收入下降但消费难以下调，正是棘轮效应；A、B 是理性调整；D 是企业定价行为。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":76,"module":"判断推理","topic":"定义判断","source":"","stem":"首因效应是指人们在交往中，最初形成的印象对后续判断影响更大。\n根据上述定义，下列最符合首因效应的是：","options":[{"k":"A","t":"因为同事最近一次表现出色而改变对他的长期看法"},{"k":"B","t":"面试官因应聘者进门时的一个小失误，而对其后续表现评价偏低"},{"k":"C","t":"因为朋友多年来的稳定表现而信任他"},{"k":"D","t":"因为一份报告写得好而赞赏作者"}],"svg":null,"tip":"与近因效应区分——首因看「最初」，近因看「最近」。","analysis":"B 项强调「进门时」这一最初信息影响后续判断，符合；A 强调最近表现，属于近因效应；C 是长期观察；D 是对具体成果的评价。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":77,"module":"判断推理","topic":"定义判断","source":"","stem":"帕金森定律是指工作会自动膨胀，直至占满所有可用的时间。\n根据上述定义，下列最符合帕金森定律的是：","options":[{"k":"A","t":"员工加班加点提前完成紧急任务"},{"k":"B","t":"团队因为任务量增加而增派人手"},{"k":"C","t":"一项本可两天完成的任务，因为给了两周期限，结果拖到两周才完成"},{"k":"D","t":"因为时间紧张，员工提高了工作效率"}],"svg":null,"tip":"定义的关键是「期限宽松 → 工作量自动膨胀/效率下降」。","analysis":"C 项任务本身只需两天，却被宽裕的期限拖满，符合；A、D 是时间紧张促使高效；B 是资源随任务调整。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"三步法：①划出定义的主体、行为、条件、结果四个要件；②用「一个要件排除一个选项」；③问「符合」打 √，问「不符合」打 ×，避免看串。","moduleTip":"","src":"orig"},{"id":78,"module":"判断推理","topic":"类比推理","source":"真题","stem":"手机∶电池∶通话","options":[{"k":"A","t":"奶粉∶牛奶∶充饥"},{"k":"B","t":"圆珠笔∶笔芯∶书写"},{"k":"C","t":"饮料∶泉水∶解渴"},{"k":"D","t":"书籍∶腰封∶学习"}],"svg":null,"tip":"整体—核心部件—主要功能。核心部件是发挥功能所必需且不可替代的。","analysis":"电池是手机实现通话功能的核心部件，笔芯是圆珠笔实现书写功能的核心部件，关系一致；A 顺序为「成品—原料」，C 泉水不是饮料的部件，D 腰封不是实现学习功能的必要部件。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":79,"module":"判断推理","topic":"类比推理","source":"","stem":"医生∶手术刀∶手术","options":[{"k":"A","t":"农民∶土地∶耕种"},{"k":"B","t":"司机∶汽车∶运输"},{"k":"C","t":"教师∶粉笔∶板书"},{"k":"D","t":"厨师∶菜谱∶烹饪"}],"svg":null,"tip":"职业—工具—具体行为。注意区分「工具」与「对象」「场地」。","analysis":"手术刀是医生的工具，手术是其行为；粉笔是教师的工具，板书是其行为，结构一致（C）。A 土地是对象，D 菜谱是依据，B 中「运输」更偏向功能而非具体动作。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":80,"module":"判断推理","topic":"类比推理","source":"","stem":"苹果∶水果∶苹果树","options":[{"k":"A","t":"手机∶电子产品∶工厂"},{"k":"B","t":"教师∶职业∶学校"},{"k":"C","t":"书籍∶知识∶图书馆"},{"k":"D","t":"牛奶∶饮品∶奶牛"}],"svg":null,"tip":"个体—属类—来源主体。","analysis":"苹果属于水果，来源于苹果树；牛奶属于饮品，来源于奶牛（D）。A 工厂是生产场所而非来源主体，B 学校是工作场所，C 知识不是书籍的属类。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":81,"module":"判断推理","topic":"类比推理","source":"","stem":"雪中送炭∶锦上添花","options":[{"k":"A","t":"落井下石∶乘人之危"},{"k":"B","t":"未雨绸缪∶临阵磨枪"},{"k":"C","t":"见义勇为∶奋不顾身"},{"k":"D","t":"破釜沉舟∶背水一战"}],"svg":null,"tip":"判断是近义还是反义。雪中送炭 = 在困难时帮助；锦上添花 = 在顺境时再添好处，二者语义相反。","analysis":"B 项未雨绸缪 = 事先准备，临阵磨枪 = 临时应付，语义相反；A、C、D 均为近义关系。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":82,"module":"判断推理","topic":"类比推理","source":"","stem":"狗∶犬","options":[{"k":"A","t":"花∶草"},{"k":"B","t":"山∶水"},{"k":"C","t":"鼠∶耗子"},{"k":"D","t":"天∶地"}],"svg":null,"tip":"全同关系——同一事物的不同称谓。","analysis":"鼠与耗子为全同关系（C）；A、B、D 均为并列关系。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":83,"module":"判断推理","topic":"类比推理","source":"","stem":"医生∶患者","options":[{"k":"A","t":"教师∶学生"},{"k":"B","t":"钢笔∶墨水"},{"k":"C","t":"轮胎∶汽车"},{"k":"D","t":"春天∶夏天"}],"svg":null,"tip":"先定关系类型，再找唯一同构项。","analysis":"医生与患者是「职业—服务对象」关系；教师与学生同构。B 是配套使用，C 是部分与整体，D 是并列。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":84,"module":"判断推理","topic":"类比推理","source":"","stem":"粮食∶加工∶食品","options":[{"k":"A","t":"农民∶种植∶粮食"},{"k":"B","t":"学生∶学习∶知识"},{"k":"C","t":"医生∶治疗∶病人"},{"k":"D","t":"木材∶加工∶家具"}],"svg":null,"tip":"原料—加工行为—成品。注意主语是人还是物。","analysis":"D 项木材经加工成为家具，与题干完全一致；A、B、C 均为「人—行为—对象」，主语是人。","answer":"D","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":85,"module":"判断推理","topic":"类比推理","source":"","stem":"温度计∶温度","options":[{"k":"A","t":"相机∶照片"},{"k":"B","t":"秤∶重量"},{"k":"C","t":"汽车∶汽油"},{"k":"D","t":"教室∶学生"}],"svg":null,"tip":"工具—被测量对象。","analysis":"温度计测量温度，秤测量重量（B）；A 是产出关系，C 是消耗关系，D 是场所与人的关系。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":86,"module":"判断推理","topic":"类比推理","source":"","stem":"蜜蜂∶蜂蜜","options":[{"k":"A","t":"工厂∶产品"},{"k":"B","t":"学生∶作业"},{"k":"C","t":"奶牛∶牛奶"},{"k":"D","t":"教师∶教案"}],"svg":null,"tip":"生物体—其自然产出物，注意区分「生理性产出」与「劳动产出」。","analysis":"蜂蜜是蜜蜂的自然产出物，牛奶是奶牛的自然产出物（C）；A、B、D 都是劳动/工作产出。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":87,"module":"判断推理","topic":"类比推理","source":"","stem":"近视∶眼镜","options":[{"k":"A","t":"感冒∶药物"},{"k":"B","t":"汽车∶轮胎"},{"k":"C","t":"手表∶指针"},{"k":"D","t":"房屋∶地基"}],"svg":null,"tip":"问题（缺陷）—解决/辅助手段。","analysis":"眼镜用于矫正近视，药物用于治疗感冒；B、C、D 均为整体与组成部分。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"先判关系类型（组成、种属、功能、条件、因果、对应、全同、近反义、语法结构），再逐项比对，优先选关系最贴合的。银行 EPI 中考得较少但常出现在互联网测评里。","moduleTip":"","src":"orig"},{"id":88,"module":"判断推理","topic":"逻辑判断","source":"","stem":"只有加强学习，才能提高能力。由此可以推出：","options":[{"k":"A","t":"加强了学习，能力就一定提高"},{"k":"B","t":"提高了能力，说明一定加强了学习"},{"k":"C","t":"不加强学习，能力也可能提高"},{"k":"D","t":"能力没有提高，说明一定没有加强学习"}],"svg":null,"tip":"「只有 A 才 B」翻译为 B→A（A 是必要条件）。","analysis":"提高能力→加强学习，即 B 项。A 属于「肯后肯前」的典型错误。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":89,"module":"判断推理","topic":"逻辑判断","source":"","stem":"如果下雨，运动会就取消。已知运动会没有取消，可以推出：","options":[{"k":"A","t":"没有下雨"},{"k":"B","t":"下雨了"},{"k":"C","t":"运动会可能取消"},{"k":"D","t":"无法确定"}],"svg":null,"tip":"否后必否前。","analysis":"下雨→取消；「没有取消」否定了后件，故可推出「没有下雨」。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":90,"module":"判断推理","topic":"逻辑判断","source":"","stem":"某单位规定：只有通过考核，才能转正。小张转正了。由此可以推出：","options":[{"k":"A","t":"小张通过了考核"},{"k":"B","t":"小张没有通过考核"},{"k":"C","t":"通过考核的人都能转正"},{"k":"D","t":"小张工作表现好"}],"svg":null,"tip":"「只有通过考核，才能转正」= 转正→通过考核。","analysis":"小张转正，即肯定了前件，必然推出通过考核。C 属于「肯后肯前」的错误。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":91,"module":"判断推理","topic":"逻辑判断","source":"","stem":"所有优秀的运动员都经过刻苦训练，小王经过刻苦训练。由此可以推出：","options":[{"k":"A","t":"小王是优秀的运动员"},{"k":"B","t":"小王可能不是优秀的运动员"},{"k":"C","t":"小王一定不是优秀的运动员"},{"k":"D","t":"刻苦训练的人都能成为优秀运动员"}],"svg":null,"tip":"所有 A 都是 B ⟹ A→B；肯后不能肯前，只能得出「可能」。","analysis":"优秀运动员→刻苦训练；小王刻苦训练，属于肯后，不能确定是否为优秀运动员，只能说「可能不是」。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":92,"module":"判断推理","topic":"逻辑判断","source":"真题","stem":"在一次考试中，分别取得数学、物理、化学和外语第一名的四位同学议论：\n甲：丁的外语考了第一名；乙：丙取得了物理第一名；丙：甲不可能取得数学第一名；丁：乙肯定取得化学第一名。\n成绩公布后发现，获得数学和外语第一名的两位同学判断正确，另外两名同学判断错误。\n则「化学第一、物理第一、外语第一、数学第一」的正确顺序是：","options":[{"k":"A","t":"甲乙丙丁"},{"k":"B","t":"乙甲丙丁"},{"k":"C","t":"丁甲丙乙"},{"k":"D","t":"丙乙丁甲"}],"svg":null,"tip":"真假话问题优先「代入选项验证」，比正向推理快得多。","analysis":"代入 B：化学第一=乙，物理第一=甲，外语第一=丙，数学第一=丁。此时外语第一的丙、数学第一的丁应说真话——丙说「甲不可能数学第一」为真；丁说「乙化学第一」为真；甲、乙的话均为假，完全自洽。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":93,"module":"判断推理","topic":"逻辑判断","source":"","stem":"甲乙丙三人中只有一人说真话。\n甲：乙在说谎；乙：丙在说谎；丙：甲乙都在说谎。\n说真话的是：","options":[{"k":"A","t":"甲"},{"k":"B","t":"乙"},{"k":"C","t":"丙"},{"k":"D","t":"无法确定"}],"svg":null,"tip":"只有一真时，用假设法逐一验证「某人真 → 其余两人是否都为假」。","analysis":"假设乙真：甲说「乙在说谎」为假；乙说「丙在说谎」为真，即丙假；丙说「甲乙都在说谎」为假，而实际上甲假乙真，确实「不是都在说谎」，自洽。假设甲真或丙真都会推出两人为真，矛盾。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":94,"module":"判断推理","topic":"逻辑判断","source":"","stem":"某研究发现，经常喝咖啡的人患某种疾病的比例较低，因此喝咖啡可以预防该疾病。以下哪项最能加强这一结论？","options":[{"k":"A","t":"该研究样本量大、跟踪时间长"},{"k":"B","t":"咖啡中的某种成分在实验中被证实能抑制该疾病的致病因子"},{"k":"C","t":"不喝咖啡的人往往更注意锻炼身体"},{"k":"D","t":"该疾病具有一定的家族遗传倾向"}],"svg":null,"tip":"加强因果论证，优先选「补充机制」的选项，因为它直接补全了因果链条。","analysis":"B 项说明咖啡中的成分确实能作用于致病因子，从机制上支持因果；A 只是研究质量，C、D 反而提示存在他因，削弱结论。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":95,"module":"判断推理","topic":"逻辑判断","source":"","stem":"某市统计显示，安装防盗门的家庭被盗率低于未安装防盗门的家庭，因此防盗门能有效防盗。以下哪项最能削弱这一结论？","options":[{"k":"A","t":"防盗门的价格普遍较高"},{"k":"B","t":"安装防盗门的家庭多住在安保条件较好的小区"},{"k":"C","t":"有的家庭安装了防盗门仍然被盗"},{"k":"D","t":"未安装防盗门的家庭数量较少"}],"svg":null,"tip":"削弱因果，优先找「他因」。","analysis":"B 项说明被盗率低可能是因为小区安保好，而非防盗门本身，属于典型他因削弱；C 举单个反例力度弱；A、D 与因果关系无关。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":96,"module":"判断推理","topic":"逻辑判断","source":"","stem":"某景区门票降价后，游客数量大幅增加，但门票总收入反而下降。以下哪项最能解释这一现象？","options":[{"k":"A","t":"景区增加了安保投入"},{"k":"B","t":"门票降价的幅度大于游客增长的幅度"},{"k":"C","t":"游客对景区的评价明显提高"},{"k":"D","t":"景区周边的餐饮收入上升"}],"svg":null,"tip":"解释矛盾要「两边都照顾到」——游客多了，但总收入少了。","analysis":"收入 = 票价 × 游客量；当票价下降幅度大于游客量增长幅度时，总收入必然下降，B 直接解释。","answer":"B","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":97,"module":"判断推理","topic":"逻辑判断","source":"","stem":"为了让市民更多使用公共交通，某市大幅提高了中心城区停车费。该措施要真正生效，最需要补充的假设是：","options":[{"k":"A","t":"市民对停车费用较为敏感"},{"k":"B","t":"公共交通的票价不高"},{"k":"C","t":"中心城区道路本来就拥堵"},{"k":"D","t":"该市的人口数量较多"}],"svg":null,"tip":"前提假设题用「否定代入法」——若该假设不成立，结论是否还站得住。","analysis":"只有市民对停车费敏感，提高停车费才会促使他们改乘公共交通。若市民对费用不敏感，措施就失效。","answer":"A","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":98,"module":"判断推理","topic":"逻辑判断","source":"","stem":"某公司规定：员工只有完成年度培训并且考核合格，才有资格参加晋升评审。小李没有参加今年的晋升评审。由此可以推出：","options":[{"k":"A","t":"小李没有完成年度培训"},{"k":"B","t":"小李考核不合格"},{"k":"C","t":"小李未完成培训，或考核不合格，或两者都有"},{"k":"D","t":"小李一定不想晋升"}],"svg":null,"tip":"逆否等价 + 联言命题的否定（「A 且 B」的否定是「非 A 或非 B」）。","analysis":"有资格 →（完成培训 且 考核合格）；小李没有参加评审，说明不具备资格，即否定后件，可推出「未完成培训 或 考核不合格」。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":99,"module":"判断推理","topic":"逻辑判断","source":"","stem":"甲说：「我觉得这部电影不好看。」乙说：「你都没看过，凭什么说不好看？」\n乙的回应存在的问题是：","options":[{"k":"A","t":"偷换概念"},{"k":"B","t":"以偏概全"},{"k":"C","t":"把「评价需要依据」偷换为「评价必须亲自观看」"},{"k":"D","t":"循环论证"}],"svg":null,"tip":"论证评价题先还原双方论点，再看反驳是否针对了论点本身。","analysis":"甲表达的是主观感受，乙把「要有依据」等同于「必须看过」，属于偷换/扩大前提，C 描述最准确。","answer":"C","materialTitle":"","materialHtml":"","sectionTip":"必背：①「如果 A 那么 B」记作 A→B，肯前必肯后、否后必否前，否前肯后不确定；②「只有 A 才 B」记作 B→A；③「所有 A 都是 B」记作 A→B；④真假话用假设法或代入法；⑤加强削弱优先看「补充论据 / 割裂因果 / 他因」。","moduleTip":"","src":"orig"},{"id":100,"module":"判断推理","topic":"图形推理","source":"","stem":"从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性。","options":[{"k":"A","t":"←"},{"k":"B","t":"→"},{"k":"C","t":"↓"},{"k":"D","t":"↙"}],"svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"666\" height=\"260\" viewBox=\"0 0 1000 390\" font-family=\"Helvetica,Arial,sans-serif\">\n\u003crect x=\"20.0\" y=\"30.0\" width=\"172\" height=\"140\" rx=\"8\" fill=\"#fcfcfc\" stroke=\"#dcdcdc\"/>\n\u003cline x1=\"106.0\" y1=\"100.0\" x2=\"148.0\" y2=\"100.0\" stroke=\"#1a1a1a\" stroke-width=\"3.0\" stroke-linecap=\"round\"/>\n\u003cline x1=\"148.0\" y1=\"100.0\" x2=\"137.6\" y2=\"106.0\" stroke=\"#1a1a1a\" stroke-width=\"3.0\" stroke-linecap=\"round\"/>\n\u003cline x1=\"148.0\" y1=\"100.0\" x2=\"137.6\" y2=\"94.0\" stroke=\"#1a1a1a\" stroke-width=\"3.0\" stroke-linecap=\"round\"/>\n\u003crect x=\"202.0\" y=\"30.0\" width=\"172\" height=\"140\" rx=\"8\" fill=\"#fcfcfc\" stroke=\"#dcdcdc\"/>\n\u003cline x1=\"288.0\" y1=\"100.0\" x2=\"317.7\" y2=\"129.7\" stroke=\"#1a1a1a\" stroke-width=\"3.0\" stroke-linecap=\"round\"/>\n\u003cline x1=\"317.7\" y1=\"129.7\" x2=\"306.1\" y2=\"126.6\" stroke=\"#1a1a1a\" stroke-width=\"3.0\" stroke-linecap=\"round\"/> const APPENDIX = {"A":"\u003ch3>资料分析核心公式\u003c/h3>\u003ctable class=\"md-table\">\u003cthead>\u003ctr>\u003cth>名称\u003c/th>\u003cth>公式\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>增长率\u003c/td>\u003ctd>r =（现期 − 基期）÷ 基期\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基期量\u003c/td>\u003ctd>基期 = 现期 ÷（1 + r）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>增长量\u003c/td>\u003ctd>增长量 = 现期 × r ÷（1 + r）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>百化分\u003c/td>\u003ctd>r = 1/n → 增长量 = 现期 ÷（n + 1）；r = −1/n → 减少量 = 现期 ÷（n − 1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>间隔增长率\u003c/td>\u003ctd>r = r₁ + r₂ + r₁r₂\u003c/td>\u003c/tr>\u003ctr>\u003ctd>混合增长率\u003c/td>\u003ctd>介于两部分之间，偏向基期量大的一方\u003c/td>\u003c/tr>\u003ctr>\u003ctd>两期比重\u003c/td>\u003ctd>a &gt; b 比重上升，a &lt; b 下降；比重差 &lt; |a − b|\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平均数增长率\u003c/td>\u003ctd>（a − b）÷（1 + b）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>倍数\u003c/td>\u003ctd>A 是 B 的 n 倍 = A÷B；A 比 B 多 n 倍 → A÷B = n + 1\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003ch3>数量关系口诀\u003c/h3>\u003cul class=\"tight\">\u003cli>工程问题：赋值总量（取时间的最小公倍数），效率比 = 时间反比。\u003c/li>\u003cli>行程问题：等距离平均速度 = 2v₁v₂/(v₁+v₂)；相遇看速度和，追及看速度差。\u003c/li>\u003cli>利润问题：利润率 = 利润 ÷ 成本（资料分析中为利润 ÷ 收入，注意区分）。\u003c/li>\u003cli>浓度问题：溶质守恒；十字交叉求质量比。\u003c/li>\u003cli>容斥问题：A∪B = A + B − A∩B。\u003c/li>\u003cli>最值问题：求最大数的最大值 → 让其余数尽可能小；求最小值 → 让各数尽可能接近。\u003c/li>\u003cli>牛吃草：原有量 + 每天生长量 × 天数 = 牛数 × 天数。\u003c/li>\u003cli>空瓶换水：先换再借瓶，公式参考总量 = N + N/(m−1)。\u003c/li>\u003cli>植树问题：两端都种 = 段数 + 1；一端种 = 段数；两端不种 = 段数 − 1；封闭 = 段数。\u003c/li>\u003c/ul>\u003ch3>判断推理口诀\u003c/h3>\u003cul class=\"tight\">\u003cli>图形推理：相同看位置，相似看样式，不同看属性，最后看数量；一笔画看奇点（0 或 2 个奇点为一笔画，笔画数 = 奇点数 ÷ 2）。\u003c/li>\u003cli>定义判断：划出主体、行为、条件、结果四个要件，一个要件排除一个选项。\u003c/li>\u003cli>类比推理：先定关系（组成、种属、功能、条件、因果、全同、近反义、语法），再逐项比对。\u003c/li>\u003cli>逻辑判断：如果 A 那么 B = A→B，肯前必肯后、否后必否前；只有 A 才 B = B→A；所有 A 都是 B = A→B；真假话优先代入选项。\u003c/li>\u003c/ul>\u003ch3>言语理解口诀\u003c/h3>\u003cul class=\"tight\">\u003cli>逻辑填空：找照应（解释、因果、转折、递进、并列）+ 辨词语（范围、轻重、色彩、搭配）。\u003c/li> /* ---------------- 通用 ---------------- */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 渲染用：先转义再转 markdown 加粗，防止题干/解析里的 < > 被当成标签 */
const mdEsc = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
const stemText = q => q.stem.replace(/\*\*/g,"").replace(/`/g,"").replace(/\s+/g," ").trim();
function fmtClock(ms){
  ms=Math.max(0,ms|0);
  const t=Math.round(ms/1000), m=Math.floor(t/60), s=t%60;
  if(m>=60) return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}
function download(name, text, mime){
  const blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function toast(msg){
  const d=document.createElement("div");

function applyRoute(){
  const raw=String(location.hash||"").replace(/^#\/?/,"");
  const parts=raw.split("/");
  const known=TABS.map(t=>t[0]);
  const v=known.indexOf(parts[0])>=0?parts[0]:"list";
  const arg=parts[1];
  if(view==="practice" && v!=="practice") bankTime();
  if(v==="practice" && arg){
    const qid=Number(arg);
    if(BY_ID[qid] && (!cur() || cur().id!==qid)){
      queue=QS.map(q=>q.id);
      idx=queue.indexOf(qid);
      if(idx<0){ queue=[qid]; idx=0; }

  }

}

  const st=$("#setTimer"); if(st&&setLimitMs) st.textContent="组卷剩余 "+fmtClock(setRemainMs);
  activeQid=q.id; qStart=Date.now();
  try{ if(location.hash!=="#/practice/"+q.id) history.replaceState(null,"","#/practice/"+q.id); }catch(e){}

let timerEl=null;
function pick(k){
  const q=cur(); const r=R(q.id);
  if(r.picked && !examMode) return;          // 练习模式已答，锁住避免误触
  if(r.picked===null) r.tries=(r.tries||0)+1;
  const prevWrong = r.correct===false;
  r.picked=k; r.correct=(k===q.answer);
  if(!r.correct && !prevWrong) r.wrong=(r.wrong||0)+1;   // 错误次数只累加，用于错题本
  r.ts=Date.now();
  save(); renderTabs();
  if(!examMode) showTip=true;                // 练习模式答完自动给标准思路
  renderPractice();
}
function next(d){
  if(idx<queue.length-1){ bankTime(); idx+=d; showTip=showAna=false; renderPractice(); }
  else { if(examMode) finishSet(); else toast("本组已到最后一题"); }
}
function finishSet(){

    +'<div class="stats"><div class="stat"><b>'+right+'/'+done.length+'</b><span>答对/已答</span></div>'
    +'<div class="stat"><b>'+(done.length?Math.round(right/done.length*100):0)+'%</b><span>正确率</span></div>'
    +'<div class="stat"><b>'+(queue.length-done.length)+'</b><span>未作答</span></div></div>'
    +'<div class="row" style="margin-top:14px"><button class="btn primary" onclick="startSet(queue.slice(),{label:\'重做本组\'})">重做本组</button>'

    +rows.map(x=>'<tr><td><a href="javascript:void(0)" onclick="jump('+x.q.id+')">'+x.q.id+'</a></td><td>'+esc(x.q.topic)+'</td><td>'+(x.r.picked||"—")+'</td><td>'+x.q.answer+'</td><td>'

   +'<div class="grid" id="grid"></div>';
  const rebuild=()=>{ fModule=$("#fm").value; fTopic=$("#ft").value; fSrc=$("#fs").value; fText=$("#fq").value.trim(); drawGrid(); };
  $("#fm").onchange=rebuild; $("#ft").onchange=rebuild; $("#fs").onchange=rebuild;
  let qt=null; $("#fq").oninput=()=>{ clearTimeout(qt); qt=setTimeout(rebuild,180); };
  $$("[data-st]").forEach(b=>b.onclick=()=>{ fState=b.dataset.st; renderList(); });
  $("#startFiltered").onclick=()=>{ const ids=filtered().map(q=>q.id); if(!ids.length) return toast("这组筛选结果为空"); startSet(ids,{label:"筛选组"}); };
  drawGrid();

function filtered(){
  return QS.filter(q=>{
    if(fModule && q.module!==fModule) return false;
    if(fTopic && q.topic!==fTopic) return false;
    if(fSrc==="orig" && isGen(q)) return false;
    if(fSrc==="gen" && !isGen(q)) return false;
    if(fText && !(q.stem+" "+q.options.map(o=>o.t).join(" ")+" "+q.tip).includes(fText)) return false;
    const r=S.rec[q.id]||{};
    if(fState==="none" && r.picked) return false;
    if(fState==="bad" && !(r.wrong>0)) return false;
    if(fState==="fav" && !r.fav) return false;
    if(fState==="doubt" && !r.doubt) return false;
    if(fState==="note" && !(r.note&&r.note.trim())) return false;
    if(fState==="ana" && q.analysis) return false;
    return true;
  });
}

  const list=filtered();

    return '<div class="qcard" data-id="'+q.id+'">'
      +'<div class="top">'+dot+'<span class="no">'+q.id+'</span><span class="chip">'+esc(q.topic)+'</span>'
      +(isGen(q)?'<span class="chip acc">生成</span>':'')
      +(q.svg?'<span class="chip">图</span>':'')+(q.analysis?'':'<span class="chip warn">无解析</span>')
      +(r.fav?'<span class="chip ok">★</span>':'')+(r.doubt?'<span class="chip warn">?</span>':'')+'</div>'
      +'<div class="stem">'+esc(stemText(q))+'</div>'
      +'<div class="bot">'+(r.picked?'<span class="chip '+(st==="ok"?"ok":"bad")+'">已答 '+r.picked+'</span>':'<span class="chip">未做</span>')
      +(r.wrong>0?'<span class="chip bad">错 '+r.wrong+' 次</span>':'')
      +((r.note&&r.note.trim())?'<span class="chip acc">有笔记</span>':'')+'</div>'

  }).join("");
  $$(".qcard").forEach(c=>c.onclick=()=>{ queue=filtered().map(q=>q.id); idx=Math.max(0,queue.indexOf(Number(c.dataset.id))); if(idx<0){queue=[Number(c.dataset.id)];idx=0;} showTip=showAna=false; examMode=false; setLimitMs=0; if(tick)clearInterval(tick); go("practice"); });
}

function wrongMD(ids){
  const L=["# 错题本（秋招行测题库）","","> 导出时间："+new Date().toLocaleString("zh-CN"),"> 共 "+ids.length+" 题",""];
  ids.forEach(id=>{ const q=BY_ID[id], r=S.rec[id]||{};
    L.push("## 第 "+id+" 题 · "+q.topic+"（错 "+r.wrong+" 次，我的答案 "+(r.picked||"—")+"，正确 "+q.answer+"）","");
    L.push("**题干**："+q.stem.replace(/\n/g," "),"");
    q.options.forEach(o=>L.push("- "+o.k+". "+o.t));

  });
  return L.join("\n");

function wrongCSV(ids){

function selIds(sel){
  if(!sel) return [];
  const pool = sel.orig ? QS.filter(q=>!isGen(q)) : QS;   // 21 天计划针对手写原题，生成题用于自由刷题
  if(sel.k==="r") return pool.filter(q=>q.id>=sel.a&&q.id<=sel.b).map(q=>q.id);
  if(sel.k==="m") return pool.filter(q=>q.module===sel.m).map(q=>q.id);
  if(sel.k==="t") return pool.filter(q=>q.topic===sel.t).map(q=>q.id);
  if(sel.k==="wrong") return Object.keys(S.rec).filter(isWrong).map(Number).sort((a,b)=>a-b);
  if(sel.k==="rand"){ const a=pool.map(q=>q.id); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,sel.n); }
  return pool.map(q=>q.id);
}

   +'<button class="btn" id="prst">重置勾选</button></div>'
   +'<p class="muted" style="margin:10px 0 0">节奏按六大行 EPI 的模块独立计时设计：第 1 周按题型吃透，第 2 周补全 + 清错题，第 3 周按模块整组模拟。每天点「开始」会自动按当天限时组卷。</p>'
   +'<div class="banner" style="margin-top:12px">银行 EPI 单题约 40—50 秒（依据六大行公开题型题量整理：中行职业能力 70 题 60 分钟、工行通用能力 58 题 71 分钟、邮储通用就业能力 40 题 50 分钟，详见「速查卡」页）。套题慢不是问题，慢在哪一步才是问题。</div>'
   +'<h3 style="margin-top:16px">自由刷题（生成题池，'+N_GEN+' 题）</h3>'
   +'<p class="muted" style="margin:0 0 8px">21 天计划针对手写原题；想加练就从这个池子里抽，答案同样经过程序反算校验，题量足够反复刷新。</p>'
   +'<div class="row">'
   +'<button class="btn" data-free="20">随机 20 题</button>'
   +'<button class="btn" data-free="50">随机 50 题</button>'
   +'<button class="btn" data-free="100">随机 100 题</button>'
   +'<button class="btn" data-free="t:数字推理">数字推理专练（'+QS.filter(q=>q.topic==="数字推理"&&isGen(q)).length+'）</button>'
   +'<button class="btn" data-free="t:数学运算">数学运算专练（'+QS.filter(q=>q.topic==="数学运算"&&isGen(q)).length+'）</button>'
   +'<button class="btn" data-free="t:资料分析">资料分析专练（'+QS.filter(q=>q.topic==="资料分析"&&isGen(q)).length+'）</button>'
   +'<button class="btn" data-free="t:逻辑判断">翻译推理专练（'+QS.filter(q=>q.topic==="逻辑判断"&&isGen(q)).length+'）</button>'
   +'</div></div>'
   +'<table class="list"><thead><tr><th>完成</th><th>天</th><th>任务</th><th>题量</th><th>限时</th><th>目标</th><th>当天要求</th><th></th></tr></thead><tbody>'
   +PLAN.map(p=>{ const n=selIds(p.sel).length; const isRev=p.sel.k==="review";
      return '<tr><td><input type="checkbox" data-day="'+p.d+'" '+(S.plan[p.d]?"checked":"")+'></td>'
      +'<td><b>D'+p.d+'</b><span class="muted"> · 第'+p.w+'周</span></td><td>'+esc(p.t)+'</td><td>'+(isRev?"—":n)+'</td><td>'+(p.min?p.min+" 分钟":"—")+'</td><td>'+p.goal+'</td>'
      +'<td class="muted">'+esc(p.act)+'</td>'
      +'<td>'+(isRev?'<button class="btn" data-goto="data">看统计</button>':'<button class="btn primary" data-start="'+p.d+'">开始</button>')+'</td></tr>'; }).join("")
   +'</tbody></table>';
  $$("#v-plan [data-day]").forEach(c=>c.onchange=()=>{ S.plan[c.dataset.day]=c.checked; save(true); renderPlan(); });
  $$("#v-plan [data-start]").forEach(b=>b.onclick=()=>{ const p=PLAN.find(x=>x.d===Number(b.dataset.start)); const ids=selIds(p.sel);
    if(!ids.length) return toast("这一组暂时没有题（错题本可能是空的）");
    startSet(ids,{label:"D"+p.d+" "+p.t,minutes:p.min}); });
  $$("#v-plan [data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
  $$("#v-plan [data-free]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.free;
    if(v.startsWith("t:")){ const ids=QS.filter(q=>isGen(q)&&q.topic===v.slice(2)).map(q=>q.id); startSet(ids,{label:v.slice(2)+"专练"}); }
    else startSet(selIds({k:"rand",n:Number(v)}),{label:"随机 "+v+" 题"});
  });
  $("#prst").onclick=()=>{ S.plan={}; save(true); renderPlan(); };
}

/* ---------------- 速查卡 ---------------- */
function renderQuick(){
  const tips={}; QS.forEach(q=>{ if(q.sectionTip&&!tips[q.topic]) tips[q.topic]=q.sectionTip; });
  const mtips={}; QS.forEach(q=>{ if(q.moduleTip&&!mtips[q.module]) mtips[q.module]=q.moduleTip; });
  $("#v-quick").innerHTML=
   '<div class="card"><h2>各题型通用破题顺序</h2>'
   +Object.keys(mtips).map(m=>'<div class="nbox"><b>'+esc(m)+'</b>：'+mdEsc(mtips[m])+'</div>').join("")
   +'<h3>分题型</h3>'
   +Object.keys(tips).map(t=>'<div class="nbox"><b>'+esc(t)+'</b>：'+mdEsc(tips[t])+'</div>').join("")
   +'</div>'
   +'<div class="card"><h2>附录 A · 技巧速查卡</h2>'+APPENDIX.A+'</div>'
   +'<div class="card"><h2>附录 B · 赛道差异与时间分配</h2>'+APPENDIX.B+'</div>'
   +'<div class="card"><h2>附录 C · 考场兜底法则</h2>'+APPENDIX.C+'</div>'
   +'<div class="card"><h2>银行 EPI 计时参考（公开题型题量整理）</h2>'
   +'<table class="list"><thead><tr><th>银行</th><th>EPI/通用能力考查内容</th><th>题量</th><th>单元用时</th><th>折算单题</th></tr></thead><tbody>'
   +[["中国银行","逻辑推理、数学运算、言语理解、思维策略、资料分析","50 题","60 分钟","约 72 秒"],
      ["中国农业银行","通用能力一：言语理解、数学运算、资料分析；通用能力二：逻辑推理、思维策略","23 + 22 题","—","—"],
      ["中国工商银行","通用能力一：言语理解、数学运算、逻辑推理；通用能力二：思维策略、资料分析","34 + 24 题","39 + 32 分钟","约 70 秒"],
      ["中国建设银行","综合能力一：言语理解、数量关系；综合能力二：逻辑推理、资料分析","34 + 31 题","40 + 55 分钟","约 83 秒"],
      ["中国邮政储蓄银行","言语理解、逻辑推理、思维策略、资料分析","40 题","50 分钟","75 秒"],
      ["交通银行","言语理解、逻辑推理、数学运算、思维策略、资料分析","40 题","—","—"]]
     .map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>').join("")
   +'</tbody></table>'
   +'<p class="muted" style="margin-top:10px">数据来源：<a href="https://tj.xbcjy.com/yhzp/jyjczs/5649534.html" target="_blank" rel="noreferrer">《国有六大行笔试内容及题型题量》</a>（按往年考生回忆整理）。各行每年题型题量与是否单元独立计时都会调整，只作节奏参考，务必以当年公告和考前模拟为准。</p>'
   +'</div>';
}

/* ---------------- 数据 ---------------- */
function renderData(){
  const ids=Object.keys(S.rec).map(Number);
  const done=ids.filter(answered);
  const right=done.filter(id=>S.rec[id].correct).length;
  const notes=ids.filter(id=>S.rec[id].note&&S.rec[id].note.trim()).length;
  const favs=ids.filter(id=>S.rec[id].fav).length;
  const doubts=ids.filter(id=>S.rec[id].doubt).length;
  const wrongN=ids.filter(id=>S.rec[id].wrong>0).length;
  const totalMs=ids.reduce((a,id)=>a+(S.rec[id].timeMs||0),0);
  const acc=a=>a.length?Math.round(a.filter(id=>S.rec[id].correct).length/a.length*100)+"%":"—";
  const doneOrig=done.filter(id=>!isGen(BY_ID[id]));
  const doneGen=done.filter(id=>isGen(BY_ID[id]));
  const modRows=MODULES.map(m=>{ const a=done.filter(id=>BY_ID[id].module===m); const all=QS.filter(q=>q.module===m).length;
    return "<tr><td>"+esc(m)+"</td><td>"+a.length+"/"+all+"</td><td>"+acc(a)+"</td><td>"
      +a.filter(id=>S.rec[id].wrong>0).length+"</td></tr>"; }).join("");
  const topRows=TOPICS.map(t=>{ const a=done.filter(id=>BY_ID[id].topic===t);
    return "<tr><td>"+esc(t)+"</td><td>"+QS.filter(q=>q.topic===t).length+"</td><td>"+a.length+"</td><td>"+acc(a)+"</td></tr>"; }).join("");
  const doubtList=ids.filter(id=>S.rec[id].doubt).sort((a,b)=>a-b);
  $("#v-data").innerHTML='<div class="card"><h2>学习数据</h2><div class="stats">'
   +'<div class="stat"><b>'+done.length+'/'+QS.length+'</b><span>已做题数</span></div>'
   +'<div class="stat"><b>'+(done.length?Math.round(right/done.length*100)+"%":"—")+'</b><span>总正确率</span></div>'
   +'<div class="stat"><b>'+wrongN+'</b><span>错题（含曾错）</span></div>'
   +'<div class="stat"><b>'+notes+'</b><span>写了思路</span></div>'
   +'<div class="stat"><b>'+favs+'</b><span>收藏</span></div>'
   +'<div class="stat"><b>'+doubts+'</b><span>存疑</span></div>'
   +'<div class="stat"><b>'+fmtClock(totalMs)+'</b><span>累计作答时长</span></div>'
   +'<div class="stat"><b>'+acc(doneOrig)+'</b><span>原题正确率（'+doneOrig.length+'/'+N_ORIG+'）</span></div>'
   +'<div class="stat"><b>'+acc(doneGen)+'</b><span>生成题正确率（'+doneGen.length+'/'+N_GEN+'）</span></div>'
   +'</div></div>'
   +'<div class="card"><h2>按模块</h2><table class="list"><thead><tr><th>模块</th><th>已做/总数</th><th>正确率</th><th>错题</th></tr></thead><tbody>'+modRows+'</tbody></table></div>'
   +'<div class="card"><h2>按题型</h2><table class="list"><thead><tr><th>题型</th><th>题量</th><th>已做</th><th>正确率</th></tr></thead><tbody>'+topRows+'</tbody></table></div>'
   +(doubtList.length?'<div class="card"><h2>存疑题（待你自己核实）</h2><p class="muted">这些题的答案你觉得可能有问题，列出来方便集中核对。</p><p>'
      +doubtList.map(id=>'<a href="javascript:void(0)" onclick="jump('+id+')">第 '+id+' 题</a>').join("　")+'</p></div>':'')
   +'<div class="card"><h2>数据管理</h2>'
   +'<p class="muted">所有进度、错题、笔记只存在本机浏览器（localStorage），不会上传。<b>换浏览器、清理浏览器数据或换电脑前，先导出备份。</b></p>'
   +'<div class="row" style="margin-top:10px">'
   +'<button class="btn primary" id="exp">导出全部数据（JSON 备份）</button>'
   +'<button class="btn" id="impBtn">导入 JSON 备份</button>'
   +'<input type="file" id="imp" accept=".json" style="display:none">'
   +'<button class="btn" id="expMD">导出错题本 Markdown</button>'
   +'<button class="btn" id="expNotes">导出我的思路 Markdown</button>'
   +'<span class="spacer"></span>'
   +'<button class="btn" id="clrRec">清空做题记录</button>'
   +'<button class="btn" id="clrNote">清空笔记</button>'
   +'<button class="btn" id="clrAll">全部重置</button>'
   +'</div></div>';
  $("#exp").onclick=()=>download("行测题库数据备份-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S,null,1), "application/json");
  $("#impBtn").onclick=()=>$("#imp").click();
  $("#imp").onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.rec) throw 0;
      const keepId=Object.keys(S.rec).some(k=>S.rec[k].note&&S.rec[k].note.trim());
      if(keepId && !confirm("当前已有笔记/进度，导入会覆盖。继续？")) return;
      S=Object.assign(blank(),o); save(true); go("data"); toast("导入成功"); }catch(err){ alert("文件格式不对，需要本页导出的 JSON"); } };
    rd.readAsText(f); };
  $("#expMD").onclick=()=>{ const w=Object.keys(S.rec).filter(isWrong).map(Number).sort((a,b)=>a-b);
    if(!w.length) return toast("错题本是空的"); download("错题本.md", wrongMD(w), "text/markdown;charset=utf-8"); };
  $("#expNotes").onclick=()=>{ const ids=QS.filter(q=>S.rec[q.id]&&S.rec[q.id].note&&S.rec[q.id].note.trim()).map(q=>q.id);
    if(!ids.length) return toast("还没写笔记");
    const L=["# 我的行测解题思路",""]; ids.forEach(id=>{ const q=BY_ID[id]; L.push("## 第 "+id+" 题 · "+q.topic,"",stemText(q),"",S.rec[id].note,"","---",""); });
    download("我的思路.md", L.join("\n"), "text/markdown;charset=utf-8"); };
  $("#clrRec").onclick=()=>{ if(!confirm("清空做题记录与错题（笔记保留）？")) return;
    Object.keys(S.rec).forEach(id=>{ S.rec[id].picked=null; S.rec[id].correct=null; S.rec[id].wrong=0; S.rec[id].tries=0; S.rec[id].timeMs=0; });
    save(true); renderData(); renderTabs(); toast("已清空做题记录"); };
  $("#clrNote").onclick=()=>{ if(!confirm("清空所有笔记？建议先导出。")) return;
    Object.keys(S.rec).forEach(id=>S.rec[id].note=""); save(true); renderData(); renderTabs(); toast("已清空笔记"); };
  $("#clrAll").onclick=()=>{ if(!confirm("全部重置（进度、错题、笔记、计划勾选）？此操作不可撤销。")) return;
    S=blank(); save(true); renderData(); renderTabs(); toast("已重置"); };
}

/* ---------------- 键盘 ---------------- */
document.addEventListener("keydown",e=>{
  if(view!=="practice") return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input") return;
  const k=e.key.toUpperCase();
  if(["1","2","3","4","A","B","C","D"].includes(k)){
    const m={"1":"A","2":"B","3":"C","4":"D"};
    pick(m[k]||k); e.preventDefault(); return;
  }
  if(e.key===" "||e.key==="Enter"){ showAna=!showAna; showTip=true; renderPractice(); e.preventDefault(); return; }
  if(e.key==="ArrowRight"){ next(1); e.preventDefault(); }
  if(e.key==="ArrowLeft"){ if(idx>0){idx--;showTip=showAna=false;renderPractice();} e.preventDefault(); }
  if(k==="F"){ const r=R(cur().id); r.fav=!r.fav; save(); renderPractice(); }
});

/* ---------------- 启动 ---------------- */
window.addEventListener("beforeunload",()=>{ bankTime(); save(true); });
window.addEventListener("hashchange",()=>{ if(!suppressHash) applyRoute(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ bankTime(); save(true); } });
/* 有网就是网站：注册 Service Worker 支持离线与「添加到主屏幕」；file:// 下自动跳过 */
if(typeof navigator!=="undefined" && navigator.serviceWorker && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
document.title="秋招行测题库 · 银行 EPI "+QS.length+" 题";
const _sub=document.getElementById("hdsub"); if(_sub) _sub.textContent="银行 EPI · 原题 "+N_ORIG+" + 生成 "+N_GEN+" · 离线可用";
renderTabs();
if(location.hash) applyRoute(); else go("list");
</script>
</body>
